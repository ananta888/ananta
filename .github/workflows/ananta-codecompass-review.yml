name: ananta-codecompass-review

# CRG-011: report-only by default; PR-comment is opt-in for trusted PRs
# only; minimal permissions; no source code sent to external services.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      fail_on_risk:
        description: "Fail the workflow when risk_score exceeds the threshold"
        type: boolean
        required: false
        default: false
      risk_threshold:
        description: "Risk-score threshold for fail_on_risk"
        type: string
        required: false
        default: "0.7"
      post_pr_comment:
        description: "Post a PR comment with the risk summary"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-graph:
    name: Build local CodeCompass graph
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build (CMake File API reply required for RIG-003)
        run: |
          if [ -f CMakeLists.txt ]; then
            cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            cmake --build build
          else
            echo "::warning::No root CMakeLists.txt found; skipping optional RIG-003 CMake build"
          fi

      - name: Install ananta dev extras (no network to upstream CRG/SPADE)
        run: |
          pip install --no-deps .
          # --no-deps keeps upstream CRG/SPADE out, but it also skips the
          # runtime dependencies this package genuinely imports.  The blast
          # radius step died on `No module named 'jsonschema'`, reached via
          # ananta_codecompass.graph_store -> ananta_contracts.file_type_support,
          # which imports jsonschema.Draft202012Validator at module level.
          # jsonschema is already declared in pyproject.toml; it is named here
          # only because --no-deps refuses to install it.
          pip install "jsonschema>=4.21,<5"

      - name: Import RIG snapshot (dry-run by default per CCRIG-DD-009)
        run: |
          mkdir -p .codecompass
          python -m scripts.import_repository_intelligence_graph \
            --workspace-dir "$GITHUB_WORKSPACE" \
            --write-index \
            --index-path .codecompass/rig_index.json \
            "$GITHUB_WORKSPACE/.code-review-graph/export.json" \
            || echo "::warning::RIG import failed; risk summary will be RIG-less"

      - name: Compute blast radius
        run: |
          mkdir -p .codecompass
          python -c "
          import json
          from worker.retrieval.codecompass_blast_radius import compute_blast_radius
          from worker.retrieval.codecompass_graph_store import CodeCompassGraphStore
          store = CodeCompassGraphStore(index_path='.codecompass/rig_index.json')
          res = compute_blast_radius(
              graph_store=store,
              seed_nodes=(),
              changed_files=(),
              max_depth=3,
          )
          with open('.codecompass/risk_summary.json', 'w') as fp:
              json.dump(res.as_dict(), fp)
          print('risk_score', res.risk_score)
          "

      - name: Upload risk summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codecompass-risk-summary
          path: .codecompass/risk_summary.json
          if-no-files-found: warn

  post-pr-comment:
    name: Post PR risk comment (trusted PRs only)
    needs: build-graph
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download risk summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: codecompass-risk-summary
          path: .codecompass

      - name: Render PR comment
        env:
          RISK_SUMMARY_PATH: .codecompass/risk_summary.json
        run: |
          python -c "
          import json, os
          with open(os.environ['RISK_SUMMARY_PATH']) as fp:
              summary = json.load(fp)
          print('## CodeCompass Risk Summary')
          print()
          print('- risk_model_version:', summary['risk_model_version'])
          print('- risk_score:', summary['risk_score'])
          print('- affected_files:', len(summary['affected_files']))
          print('- affected_symbols:', len(summary['affected_symbols']))
          print('- affected_tests:', len(summary['affected_tests']))
          print('- evidence_paths:', len(summary['evidence_paths']))
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on risk (opt-in)
        if: ${{ inputs.fail_on_risk == true }}
        env:
          RISK_SUMMARY_PATH: .codecompass/risk_summary.json
        run: |
          python -c "
          import json, os, sys
          with open(os.environ['RISK_SUMMARY_PATH']) as fp:
              summary = json.load(fp)
          threshold = float('${{ inputs.risk_threshold }}')
          if summary['risk_score'] > threshold:
              sys.exit(1)
          "
