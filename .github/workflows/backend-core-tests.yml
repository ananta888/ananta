name: Backend Core Tests

# The complete default (core) backend suite on every push and pull request, split into parallel shards that
# each finish within 10 minutes. The slow tier (tests/slow/, tests/slow_tests.txt, @slow) runs nightly in
# backend-slow-tests.yml. Tiers and sharding: tests/tiering.py, tests/sharding.py, docs/testing.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-core-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  DEFAULT_PROVIDER: mock
  DEFAULT_MODEL: mock
  ANANTA_QUICKSTART_MODE: agent-only
  SHARD_COUNT: "4"

jobs:
  core:
    name: core shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # course/evidence validators resolve paths at recorded repository revisions
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            rag-helper/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install the Compose plugin pinned in the test image (compose contract tests render with it)
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
            https://github.com/docker/compose/releases/download/v5.1.3/docker-compose-linux-x86_64
          echo "a0298760c9772d2c06888fc8703a487c94c3c3b0134adeef830742a2fc7647b4  $HOME/.docker/cli-plugins/docker-compose" \
            | sha256sum --check --strict
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version | grep -F "v5.1.3"
      - name: Install backend test dependencies (as in docker/compose-next/Dockerfile.tests-backend)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r rag-helper/requirements.txt -r requirements-dev.lock
          pip install temporalio==1.30.0 playwright==1.58.0 hypothesis==6.167.1 crosshair-tool==0.0.110 hypothesis-crosshair==0.0.30
      - name: Run core shard ${{ matrix.shard }} of ${{ env.SHARD_COUNT }}
        run: >
          python -m pytest -q -p no:cacheprovider -o addopts='' -n 4 --timeout=300
          --tier core --shard-count "$SHARD_COUNT" --shard-index ${{ matrix.shard }}
          --durations=15 --junitxml=test-results-core-${{ matrix.shard }}.xml tests
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-core-tests-${{ matrix.shard }}
          path: test-results-core-${{ matrix.shard }}.xml
          retention-days: 7
