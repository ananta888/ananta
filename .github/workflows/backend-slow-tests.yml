name: Backend Slow Tests

# The slow tier (tests/slow/, tests/slow_tests.txt, @slow): expensive migrations, real toolchains,
# end-to-end flows and drills that are not part of the per-push core run (backend-core-tests.yml).

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-slow-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  DEFAULT_PROVIDER: mock
  DEFAULT_MODEL: mock
  ANANTA_QUICKSTART_MODE: agent-only
  SHARD_COUNT: "2"

jobs:
  slow:
    name: slow shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            rag-helper/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install backend test dependencies (as in docker/compose-next/Dockerfile.tests-backend)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r rag-helper/requirements.txt -r requirements-dev.lock
          pip install temporalio==1.30.0 playwright==1.58.0 hypothesis==6.167.1 crosshair-tool==0.0.110 hypothesis-crosshair==0.0.30
      - name: Run slow shard ${{ matrix.shard }} of ${{ env.SHARD_COUNT }}
        run: >
          python -m pytest -q -p no:cacheprovider -o addopts='' -n 4 --timeout=900
          --tier slow --shard-count "$SHARD_COUNT" --shard-index ${{ matrix.shard }}
          --durations=25 --junitxml=test-results-slow-${{ matrix.shard }}.xml tests
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-slow-tests-${{ matrix.shard }}
          path: test-results-slow-${{ matrix.shard }}.xml
          retention-days: 14
