name: Unsloth Release Gate

on:
  pull_request:
    paths:
      - "scripts/run_lora_training_smoke.py"
      - "scripts/lora_training_smoke_*.py"
      - "scripts/run-lora-training-stack.sh"
      - "ananta_contracts/**"
      - "worker/runtime/lora_training_app.py"
      - "worker/training/**"
      - "agent/services/ml_intern_*"
      - "agent/services/unsloth_*"
      # The repository layer was missing here, so the gate did not run on the
      # code its own tests exercise — the admission bug it should have caught
      # sat red for days without a push ever triggering it.
      - "agent/repositories/ml_intern_*"
      - "agent/db_models/ml_intern_*"
      - "agent/routes/ml_intern_training*.py"
      - "agent/mcp/**"
      - "agent/studio/**"
      - "frontend-angular/src/app/features/model-training/**"
      - "frontend-angular/tests/unsloth-model-training-fake-hub.spec.ts"
      - "docker/compose-next/Dockerfile.lora-training-worker"
      - "docker/compose-next/compose.lora-training.yml"
      - "docker/compose-next/requirements.lora-training-*.txt"
      - "tests/test_unsloth_release_attestation.py"
      - "tests/test_unsloth_*.py"
      - "tests/test_studio_*training*.py"
      - "tests/test_mcp_*training*.py"
      - "tests/test_ml_intern_artifact_security_service.py"
      - "tests/test_ml_intern_training_config_service.py"
      - "tests/test_ml_intern_training_contract_v2.py"
      - "tests/worker/test_lora_training_*.py"
      - "tests/worker/test_unsloth_*.py"
      - ".github/workflows/unsloth-release-gate.yml"
      - "docs/unsloth-release-gates.md"
      - "docs/contracts/unsloth-gpu-compatibility-matrix.v1.json"
      - "docs/contracts/*lora-training*.schema.json"
      - "docs/contracts/unsloth-*.schema.json"
      - "docs/operations/unsloth-gpu-compatibility-and-rollback.md"
  push:
    branches: [main]
    paths:
      - "scripts/run_lora_training_smoke.py"
      - "scripts/lora_training_smoke_*.py"
      - "scripts/run-lora-training-stack.sh"
      - "ananta_contracts/**"
      - "worker/runtime/lora_training_app.py"
      - "worker/training/**"
      - "agent/services/ml_intern_*"
      - "agent/services/unsloth_*"
      - "agent/routes/ml_intern_training*.py"
      - "agent/mcp/**"
      - "agent/studio/**"
      - "frontend-angular/src/app/features/model-training/**"
      - "frontend-angular/tests/unsloth-model-training-fake-hub.spec.ts"
      - "docker/compose-next/requirements.lora-training-*.txt"
      - "docker/compose-next/Dockerfile.lora-training-worker"
      - "docker/compose-next/compose.lora-training.yml"
      - "tests/test_unsloth_release_attestation.py"
      - "tests/test_unsloth_*.py"
      - "tests/test_ml_intern_*.py"
      - "tests/test_studio_*training*.py"
      - "tests/test_mcp_*training*.py"
      - "tests/worker/test_lora_training_*.py"
      - "tests/worker/test_unsloth_*.py"
      - ".github/workflows/unsloth-release-gate.yml"
      - "docs/contracts/unsloth-gpu-compatibility-matrix.v1.json"
      - "docs/contracts/*lora-training*.schema.json"
      - "docs/contracts/unsloth-*.schema.json"
      - "docs/operations/unsloth-gpu-compatibility-and-rollback.md"
  workflow_dispatch:
    inputs:
      src_ids:
        description: "Comma-separated externally supplied SRC_* evidence IDs"
        required: true
        type: string
      run_ids:
        description: "Comma-separated externally supplied RUN_* evidence IDs"
        required: true
        type: string
      runtime_image_digest:
        description: "Executed worker image digest, sha256:<64 lowercase hex>"
        required: true
        type: string
      model_path:
        description: "Absolute path to the approved local smoke model on the GPU runner"
        required: true
        type: string
      compatibility_entry:
        description: "Approved model/driver/image compatibility matrix entry"
        required: true
        default: "unsloth-2026.7.5-cu124-torch260-tiny-causal-lm"
        type: string

permissions:
  contents: read

concurrency:
  group: unsloth-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-contract-security:
    name: CPU contract and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
      - name: Run deterministic Unsloth contracts and security boundaries
        run: |
          shopt -s nullglob
          test_files=(
            tests/test_unsloth*.py
            tests/test_ml_intern_*.py
            tests/test_studio_*training*.py
            tests/test_mcp_*training*.py
            tests/worker/test_lora_training_*.py
            tests/worker/test_unsloth_*.py
          )
          pytest -q "${test_files[@]}" \
            --junitxml=unsloth-cpu-contract-security.xml
      - name: Record honest GPU boundary status
        if: github.event_name != 'workflow_dispatch'
        run: |
          cat > unsloth-gpu-profile-not-run.json <<'JSON'
          {
            "schema": "ananta.unsloth-gpu-profile-status.v1",
            "status": "not_run",
            "reason_code": "manual_gpu_runner_and_external_evidence_required",
            "source_ids": [],
            "run_ids": []
          }
          JSON
      - name: Upload CPU gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsloth-cpu-contract-security
          path: |
            unsloth-cpu-contract-security.xml
            unsloth-gpu-profile-not-run.json
          if-no-files-found: error

  cpu-angular-fake-hub:
    name: Angular contracts and Fake-Hub E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Install Fake-Hub backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.lock -r ../requirements-dev.lock
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Angular model-training contracts
        run: npx vitest run
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run model-training Fake-Hub E2E
        env:
          E2E_BROWSERS: chromium
          E2E_WORKERS: "1"
        run: npx playwright test tests/unsloth-model-training-fake-hub.spec.ts --project=chromium
      - name: Upload frontend gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsloth-angular-fake-hub
          path: |
            frontend-angular/playwright-report
            frontend-angular/test-results
          if-no-files-found: warn

  gpu-unsloth-prerelease:
    name: Manual self-hosted Unsloth GPU pre-release evidence
    if: github.event_name == 'workflow_dispatch'
    needs:
      - cpu-contract-security
      - cpu-angular-fake-hub
    runs-on: [self-hosted, linux, x64, gpu, nvidia]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate externally supplied evidence bindings
        env:
          SRC_IDS: ${{ inputs.src_ids }}
          RUN_IDS: ${{ inputs.run_ids }}
          RUNTIME_IMAGE_DIGEST: ${{ inputs.runtime_image_digest }}
          COMPATIBILITY_ENTRY: ${{ inputs.compatibility_entry }}
        run: |
          [[ "$SRC_IDS" =~ (^|,)SRC_[A-Za-z0-9][A-Za-z0-9._:-]{0,191}(,|$) ]]
          [[ "$RUN_IDS" =~ (^|,)RUN_[A-Za-z0-9][A-Za-z0-9._:-]{0,191}(,|$) ]]
          [[ "$RUNTIME_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$COMPATIBILITY_ENTRY" == "unsloth-2026.7.5-cu124-torch260-tiny-causal-lm" ]]
      - name: Run required Unsloth GPU profile
        env:
          ANANTA_UNSLOTH_SRC_IDS: ${{ inputs.src_ids }}
          ANANTA_UNSLOTH_RUN_IDS: ${{ inputs.run_ids }}
          ANANTA_LORA_WORKER_IMAGE_SHA256: ${{ inputs.runtime_image_digest }}
          MODEL_PATH: ${{ inputs.model_path }}
        run: |
          python scripts/run_lora_training_smoke.py \
            --skip-mock \
            --require-nvidia \
            --profile unsloth \
            --nvidia-model "$MODEL_PATH" \
            --compatibility-matrix docs/contracts/unsloth-gpu-compatibility-matrix.v1.json \
            --matrix-entry "${{ inputs.compatibility_entry }}" \
            --repeat 3 \
            --out unsloth-gpu-release-evidence.json
      - name: Require a verified support claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("unsloth-gpu-release-evidence.json").read_text(encoding="utf-8"))
          claim = report.get("unsloth_support_claim") or {}
          smoke = report.get("nvidia_live_smoke") or {}
          attestation = smoke.get("compatibility_attestation") or {}
          runs = smoke.get("runs") or []
          if smoke.get("deterministic_run_count") != 3 or len(runs) != 3:
              raise SystemExit("Exactly three independent GPU runs are required")
          if attestation.get("status") != "passed":
              raise SystemExit(f"Compatibility profile not attested: {attestation}")
          if any(not run.get("attestation_sha256") for run in runs):
              raise SystemExit("Per-run attestation is incomplete")
          if claim.get("verified") is not True:
              raise SystemExit(f"Unsloth support remains unverified: {claim.get('reason_codes')}")
          PY
      - name: Upload GPU pre-release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsloth-gpu-release-evidence
          path: unsloth-gpu-release-evidence.json
          if-no-files-found: warn
