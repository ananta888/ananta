name: Spreadsheet Studio Release Gate

on:
  pull_request:
    paths:
      - "agent/**spreadsheet*"
      - "worker/**spreadsheet*"
      - "tests/spreadsheet_studio/**"
      - "frontend-angular/src/app/features/spreadsheet-studio/**"
      - "frontend-angular/tests/spreadsheet-studio-accessibility.spec.ts"
      - "docker/compose-next/compose.spreadsheet-studio.yml"
      - "config/release-gates/spreadsheet-studio.v1.json"
      - "schemas/spreadsheet-studio/**"
      - "scripts/*spreadsheet_studio*"
      - "docs/research/spreadsheet-studio/**"
      - "todos/archiv/todo.track.spreadsheet-studio-production-hardening.json"
      - ".github/workflows/spreadsheet-studio-release-gate.yml"
  push:
    branches: [main]
    paths:
      - "agent/**spreadsheet*"
      - "worker/**spreadsheet*"
      - "tests/spreadsheet_studio/**"
      - "frontend-angular/src/app/features/spreadsheet-studio/**"
      - "frontend-angular/tests/spreadsheet-studio-accessibility.spec.ts"
      - "docker/compose-next/compose.spreadsheet-studio.yml"
      - "config/release-gates/spreadsheet-studio.v1.json"
      - "schemas/spreadsheet-studio/**"
      - "scripts/*spreadsheet_studio*"
      - "docs/research/spreadsheet-studio/**"
      - "todos/archiv/todo.track.spreadsheet-studio-production-hardening.json"
      - ".github/workflows/spreadsheet-studio-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spreadsheet-studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-contract-security:
    name: CPU contracts, security, and optional GPU status
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install test dependencies
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Run closed CPU and security gates
        run: >-
          python scripts/run_spreadsheet_studio_release_gate.py
          --group unit_contract_property
          --group security_negative
          --output artifacts/test-gates/spreadsheet-studio-cpu-security.json
      - name: Record honest optional GPU status
        run: >-
          python scripts/run_spreadsheet_studio_release_gate.py
          --group gpu_lora_smoke
          --output artifacts/test-gates/spreadsheet-studio-gpu-status.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spreadsheet-studio-cpu-security
          path: artifacts/test-gates/spreadsheet-studio-*.json
          if-no-files-found: warn

  libreoffice-real-file:
    name: LibreOffice real-file gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install LibreOffice and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-calc
          pip install -r requirements.lock -r requirements-dev.lock
      - name: Run real-file gate
        run: >-
          python scripts/run_spreadsheet_studio_release_gate.py
          --group libreoffice_real_file
          --output artifacts/test-gates/spreadsheet-studio-libreoffice.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spreadsheet-studio-libreoffice
          path: artifacts/test-gates/spreadsheet-studio-libreoffice.json
          if-no-files-found: warn

  container-recovery:
    name: Container contract and recovery gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install test dependencies
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Run container and recovery gate
        run: >-
          python scripts/run_spreadsheet_studio_release_gate.py
          --group container_recovery
          --output artifacts/test-gates/spreadsheet-studio-container.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spreadsheet-studio-container
          path: artifacts/test-gates/spreadsheet-studio-container.json
          if-no-files-found: warn

  angular-accessibility:
    name: Real Chromium accessibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Install backend and frontend dependencies
        run: |
          pip install -r requirements.lock -r requirements-dev.lock
          npm ci --prefix frontend-angular
          npm --prefix frontend-angular exec -- playwright install --with-deps chromium
      - name: Run real-browser gate
        run: >-
          python scripts/run_spreadsheet_studio_release_gate.py
          --group angular_accessibility_e2e
          --output artifacts/test-gates/spreadsheet-studio-browser.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spreadsheet-studio-browser
          path: artifacts/test-gates/spreadsheet-studio-browser.json
          if-no-files-found: warn
