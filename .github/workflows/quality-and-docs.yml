name: Quality And Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-and-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.lock
      - name: Verify the standard backend remains Qdrant-free
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('qdrant_client') is None"
          pytest -q tests/test_vector_store_config.py tests/test_vector_store_factory.py
      - name: Run unified check pipeline (standard backend gate)
        run: python scripts/check_pipeline.py --mode standard --skip-style --skip-types

      - name: Source file line limit gate
        env:
          PYTHONPATH: "."
        run: >
          python scripts/audit/source_file_line_count.py
          --threshold 1000
          --allowlist reports/source-files-over-1000-allowlist.json
          --fail-on-source-over-threshold
          --over-threshold-only

      - name: WFG-028 workflow-gates quality gate
        run: python scripts/check_workflow_gates.py

  qdrant-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANANTA_QDRANT_API_KEY: ci-disposable-qdrant-key
      ANANTA_QDRANT_API_KEY_FILE: /tmp/ananta-qdrant-integration-api-key
      ANANTA_QDRANT_TLS_CA_FILE: /tmp/ananta-qdrant-integration-ca.pem
      ANANTA_QDRANT_TLS_CERT_FILE: /tmp/ananta-qdrant-integration-cert.pem
      ANANTA_QDRANT_TLS_KEY_FILE: /tmp/ananta-qdrant-integration-key.pem
      ANANTA_QDRANT_URL: https://localhost:6333
      COMPOSE_PROJECT_NAME: ananta-qdrant-integration
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
      - name: Install the bounded Qdrant worker extra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
          pip install -r docker/compose-next/requirements.qdrant-worker.lock
          python -c "from importlib.metadata import version; assert version('qdrant-client') == '1.18.0'"
          pip check
      - name: Render the standalone digest-pinned profile
        run: |
          rm -f \
            "${ANANTA_QDRANT_API_KEY_FILE}" \
            "${ANANTA_QDRANT_TLS_CA_FILE}" \
            "${ANANTA_QDRANT_TLS_CERT_FILE}" \
            "${ANANTA_QDRANT_TLS_KEY_FILE}"
          QDRANT_COMPOSE_ENV_FILE="${RUNNER_TEMP}/ananta-qdrant-compose.env"
          QDRANT_COMPOSE_MISSING_ADMIN_ENV_FILE="${RUNNER_TEMP}/ananta-qdrant-missing-admin.env"
          QDRANT_COMPOSE_MISSING_ADMIN_LOG="${RUNNER_TEMP}/ananta-qdrant-missing-admin.log"
          trap 'rm -f "${QDRANT_COMPOSE_ENV_FILE}" "${QDRANT_COMPOSE_MISSING_ADMIN_ENV_FILE}" "${QDRANT_COMPOSE_MISSING_ADMIN_LOG}"' EXIT
          printf '%s\n' 'INITIAL_ADMIN_PASSWORD=ci-render-only' > "${QDRANT_COMPOSE_ENV_FILE}"
          printf '%s\n' 'INITIAL_ADMIN_PASSWORD=' > "${QDRANT_COMPOSE_MISSING_ADMIN_ENV_FILE}"
          if env -u INITIAL_ADMIN_PASSWORD docker compose \
            --env-file "${QDRANT_COMPOSE_MISSING_ADMIN_ENV_FILE}" \
            -f docker/compose-next/compose.stack.quickstart.yml \
            --profile qdrant config --quiet \
            2> "${QDRANT_COMPOSE_MISSING_ADMIN_LOG}"; then
            echo "quickstart render accepted an empty INITIAL_ADMIN_PASSWORD" >&2
            exit 1
          fi
          grep -q INITIAL_ADMIN_PASSWORD "${QDRANT_COMPOSE_MISSING_ADMIN_LOG}"
          docker compose \
            -f docker/compose-next/compose.qdrant.yml \
            --profile qdrant config --quiet
          docker compose \
            -f docker/compose-next/compose.qdrant.yml \
            -f docker/compose-next/compose.qdrant-grpc-host.yml \
            --profile qdrant config --quiet
          env -u INITIAL_ADMIN_PASSWORD docker compose \
            --env-file "${QDRANT_COMPOSE_ENV_FILE}" \
            -f docker/compose-next/compose.stack.quickstart.yml \
            -f docker/compose-next/compose.workflow-runtime.dev-auth.yml \
            -f docker/compose-next/compose.qdrant.yml \
            -f docker/compose-next/compose.qdrant-workers.yml \
            --profile qdrant config --quiet
          ANANTA_CODECOMPASS_VECTOR_WORKSPACE_ID=ci-workspace \
          ANANTA_CODECOMPASS_VECTOR_REPOSITORY_ID=ci-repository \
          env -u INITIAL_ADMIN_PASSWORD docker compose \
            --env-file "${QDRANT_COMPOSE_ENV_FILE}" \
            -f docker/compose-next/compose.stack.quickstart.yml \
            -f docker/compose-next/compose.workflow-runtime.dev-auth.yml \
            -f docker/compose-next/compose.qdrant.yml \
            -f docker/compose-next/compose.qdrant-workers.yml \
            -f docker/compose-next/compose.qdrant-hub-read.yml \
            --profile qdrant config --quiet
          ANANTA_WIKI_VECTOR_WORKSPACE_ID=ci-wiki-workspace \
          ANANTA_WIKI_VECTOR_SOURCE_ID=ci-wiki-source \
          env -u INITIAL_ADMIN_PASSWORD docker compose \
            --env-file "${QDRANT_COMPOSE_ENV_FILE}" \
            -f docker/compose-next/compose.stack.quickstart.yml \
            -f docker/compose-next/compose.workflow-runtime.dev-auth.yml \
            -f docker/compose-next/compose.qdrant.yml \
            -f docker/compose-next/compose.qdrant-workers.yml \
            -f docker/compose-next/compose.qdrant-wiki-hub-read.yml \
            --profile qdrant config --quiet
          test ! -e "${ANANTA_QDRANT_API_KEY_FILE}"
          test ! -e "${ANANTA_QDRANT_TLS_CA_FILE}"
          test ! -e "${ANANTA_QDRANT_TLS_CERT_FILE}"
          test ! -e "${ANANTA_QDRANT_TLS_KEY_FILE}"
      - name: Start Qdrant and record immutable versions
        run: |
          mkdir -p ci-artifacts/qdrant-integration
          install -m 0600 /dev/null "${ANANTA_QDRANT_API_KEY_FILE}"
          printf '%s' "${ANANTA_QDRANT_API_KEY}" > "${ANANTA_QDRANT_API_KEY_FILE}"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj "/CN=Ananta Qdrant CI CA" \
            -keyout /tmp/ananta-qdrant-integration-ca-key.pem \
            -out "${ANANTA_QDRANT_TLS_CA_FILE}"
          openssl req -new -newkey rsa:2048 -sha256 -nodes \
            -subj "/CN=qdrant" \
            -addext "subjectAltName=DNS:qdrant,DNS:localhost,IP:127.0.0.1" \
            -keyout "${ANANTA_QDRANT_TLS_KEY_FILE}" \
            -out /tmp/ananta-qdrant-integration.csr
          openssl x509 -req -sha256 -days 1 \
            -in /tmp/ananta-qdrant-integration.csr \
            -CA "${ANANTA_QDRANT_TLS_CA_FILE}" \
            -CAkey /tmp/ananta-qdrant-integration-ca-key.pem \
            -CAcreateserial -copy_extensions copy \
            -out "${ANANTA_QDRANT_TLS_CERT_FILE}"
          chmod 0600 \
            "${ANANTA_QDRANT_API_KEY_FILE}" \
            "${ANANTA_QDRANT_TLS_KEY_FILE}"
          chmod 0644 \
            "${ANANTA_QDRANT_TLS_CA_FILE}" \
            "${ANANTA_QDRANT_TLS_CERT_FILE}"
          openssl verify \
            -CAfile "${ANANTA_QDRANT_TLS_CA_FILE}" \
            "${ANANTA_QDRANT_TLS_CERT_FILE}"
          docker compose \
            -f docker/compose-next/compose.qdrant.yml \
            --profile qdrant pull qdrant
          docker compose \
            -f docker/compose-next/compose.qdrant.yml \
            --profile qdrant up -d --no-build --wait --wait-timeout 120 qdrant
          container_id="$(docker compose \
            -f docker/compose-next/compose.qdrant.yml \
            --profile qdrant ps -q qdrant)"
          expected_image_ref="qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c"
          observed_image_ref="$(docker inspect \
            --format '{{.Config.Image}}' "${container_id}")"
          test "${observed_image_ref}" = "${expected_image_ref}"
          if curl --fail --silent --show-error \
            http://127.0.0.1:6333/healthz >/dev/null 2>&1; then
            echo "Qdrant unexpectedly accepted plaintext HTTP" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --cacert "${ANANTA_QDRANT_TLS_CA_FILE}" \
            https://localhost:6333/healthz >/dev/null
          observed_server_version="$(python - <<'PY'
          import os
          from qdrant_client import QdrantClient

          client = QdrantClient(
              url=os.environ["ANANTA_QDRANT_URL"],
              api_key=os.environ["ANANTA_QDRANT_API_KEY"],
              verify=os.environ["ANANTA_QDRANT_TLS_CA_FILE"],
          )
          try:
              print(client.info().version)
          finally:
              client.close()
          PY
          )"
          test "${observed_server_version}" = "1.18.2"
          {
            echo "server_image_id=$(docker inspect --format '{{.Image}}' "${container_id}")"
            echo "server_image_ref=${observed_image_ref}"
            echo "server_version=${observed_server_version}"
            echo "transport=https"
            echo "tls_verification=private_ca"
            python -c "from importlib.metadata import version; print('qdrant_client_version=' + version('qdrant-client'))"
            echo "test_marker=qdrant_integration"
          } | tee ci-artifacts/qdrant-integration/versions.txt
      - name: Run the real Qdrant release contract
        run: |
          pytest -q -m qdrant_integration \
            --junitxml=ci-artifacts/qdrant-integration/junit.xml \
            tests/test_qdrant_vector_store_integration.py \
            | tee ci-artifacts/qdrant-integration/pytest.log
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(
              Path("ci-artifacts/qdrant-integration/junit.xml")
          ).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          executed = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          if executed <= 0 or skipped != 0:
              raise SystemExit(
                  f"qdrant integration gate invalid: executed={executed}, "
                  f"skipped={skipped}"
              )
          Path("ci-artifacts/qdrant-integration/gate.txt").write_text(
              f"executed={executed}\nskipped={skipped}\ncleanup=pending\n",
              encoding="utf-8",
          )
          PY
      - name: Prove inconclusive benchmark evidence cannot pass
        run: |
          set +e
          python scripts/benchmark/qdrant_vector_store.py \
            --profile small \
            --output ci-artifacts/qdrant-integration/benchmark-inconclusive.json
          benchmark_rc="$?"
          set -e
          test "${benchmark_rc}" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(
              Path(
                  "ci-artifacts/qdrant-integration/"
                  "benchmark-inconclusive.json"
              ).read_text(encoding="utf-8")
          )
          assert artifact["status"] == "inconclusive"
          assert artifact["exit_code"] == 2
          assert artifact["reason_code"] == "reference_host_not_approved"
          assert (
              artifact["metrics"]["custom"].get("backend_recommendation")
              is None
          )
          PY
      - name: Remove run-scoped Qdrant state
        if: always()
        run: |
          mkdir -p ci-artifacts/qdrant-integration
          docker compose \
            -f docker/compose-next/compose.qdrant.yml \
            --profile qdrant down --volumes --remove-orphans
          test -z "$(docker ps -aq \
            --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")"
          test -z "$(docker volume ls -q \
            --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")"
          test -z "$(docker network ls -q \
            --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")"
          rm -f "${ANANTA_QDRANT_API_KEY_FILE}"
          rm -f \
            "${ANANTA_QDRANT_TLS_CA_FILE}" \
            "${ANANTA_QDRANT_TLS_CERT_FILE}" \
            "${ANANTA_QDRANT_TLS_KEY_FILE}" \
            /tmp/ananta-qdrant-integration-ca-key.pem \
            /tmp/ananta-qdrant-integration-ca.srl \
            /tmp/ananta-qdrant-integration.csr
          if test -f ci-artifacts/qdrant-integration/gate.txt; then
            sed -i 's/cleanup=pending/cleanup=completed/' \
              ci-artifacts/qdrant-integration/gate.txt
          else
            printf '%s\n' \
              'executed=0' \
              'skipped=unknown' \
              'cleanup=completed' \
              > ci-artifacts/qdrant-integration/gate.txt
          fi
          echo "Qdrant integration release-gate evidence (redacted):"
          if test -f ci-artifacts/qdrant-integration/versions.txt; then
            cat ci-artifacts/qdrant-integration/versions.txt
          fi
          cat ci-artifacts/qdrant-integration/gate.txt
      - name: Upload Qdrant integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qdrant-integration-evidence
          path: ci-artifacts/qdrant-integration/
          if-no-files-found: error
          retention-days: 14

  workflow-runtime-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.lock
          pip install -r docker/compose-next/requirements.langgraph-worker.lock
          pip install temporalio==1.30.0
          pip check
      - name: Validate runtime inventory, threat gate and example docs
        run: python scripts/validate_workflow_runtime_docs.py
      - name: Run mandatory workflow-runtime security regressions
        run: >
          pytest -q
          tests/security/workflow_runtime/test_workflow_runtime_security_docs.py
          tests/security/workflow_runtime/test_agent_token_file_security.py
          tests/security/workflow_runtime/test_combined_production_compose.py
          tests/security/workflow_runtime/test_file_credentials.py
          tests/security/workflow_runtime/test_native_production_compose.py
          tests/security/workflow_runtime/test_langgraph_checkpoint_production_compose.py
          tests/security/workflow_runtime/test_production_cors_policy.py
          tests/security/workflow_runtime/test_registered_worker_service_auth.py
          tests/security/workflow_runtime/test_secret_key_file_security.py
          tests/security/workflow_runtime/test_workflow_telemetry_headers_file_security.py
          tests/security/workflow_runtime/test_workflow_worker_assignment_service.py
          tests/security/workflow_runtime/test_workflow_runtime_production_compose.py
          tests/test_agent_token_file_auth.py
          tests/test_workflow_runtime_security_and_evolution.py
          tests/test_workflow_runtime_commands_components.py
          tests/test_workflow_runtime_event_and_checkpoint_stores.py
          tests/test_workflow_runtime_side_effect_ledger.py
          tests/test_workflow_hub_task_gateway_runtime.py
          tests/test_tool_calling_pipeline.py
          tests/test_temporal_runtime_contracts.py
          tests/test_workflow_runtime_cli_tui_projection.py
          tests/test_temporal_history_projection.py
          tests/workflow_runtime/examples/test_workflow_runtime_example.py
      - name: Run AIR-055 migration, restore, rollout and incident drills
        run: |
          mkdir -p ci-artifacts/workflow-runtime-operations
          python scripts/run-workflow-runtime-operations-drills.py \
            --source-revision "${GITHUB_SHA}" \
            --output ci-artifacts/workflow-runtime-operations/evidence.json
      - name: Upload workflow-runtime operations evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-runtime-operations-evidence
          path: ci-artifacts/workflow-runtime-operations/evidence.json
          retention-days: 7

  workflow-runtime-example-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANANTA_WORKFLOW_RUNTIME_EXAMPLE_IMAGE: ananta-workflow-runtime-example:ci
      COMPOSE_PROJECT_NAME: ananta-runtime-example-ci
      TEMPORAL_POSTGRES_PASSWORD: public-disposable-example-only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build cached example image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/compose-next/Dockerfile.workflow-runtime-example
          build-args: TEMPORALIO_VERSION=1.30.0
          tags: ananta-workflow-runtime-example:ci
          load: true
          cache-from: type=gha,scope=workflow-runtime-example
          cache-to: type=gha,scope=workflow-runtime-example,mode=max
      - name: Render bounded fake-provider drill
        run: |
          mkdir -p ci-artifacts/workflow-runtime-example
          docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            config --quiet
      - name: Start disposable Temporal, example Hub and worker
        run: |
          timeout 240s docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            up -d --no-build --wait --wait-timeout 180 \
            temporal-db temporal workflow-runtime-example-hub \
            workflow-runtime-example-temporal-worker
      - name: Prepare Failure, Approval, Cancel and durable crash checkpoint
        run: |
          timeout 240s docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            run --rm --no-deps workflow-runtime-example-runner --mode prepare \
            | tee ci-artifacts/workflow-runtime-example/prepare.json
      - name: Hard-kill only the Temporal example worker
        run: |
          worker_id="$(docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            ps -q workflow-runtime-example-temporal-worker)"
          test -n "${worker_id}"
          docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            kill -s SIGKILL workflow-runtime-example-temporal-worker
          for _ in $(seq 1 40); do
            state="$(docker inspect --format '{{.State.Status}}' "${worker_id}")"
            if [ "${state}" != "running" ]; then
              break
            fi
            sleep 0.25
          done
          docker inspect "${worker_id}" \
            > ci-artifacts/workflow-runtime-example/worker-after-sigkill.json
          test "$(docker inspect --format '{{.State.Status}}' "${worker_id}")" = "exited"
          test "$(docker inspect --format '{{.State.ExitCode}}' "${worker_id}")" = "137"
      - name: Replace worker and resume the same durable workflow
        run: |
          timeout 180s docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            up -d --no-build --force-recreate --wait --wait-timeout 120 \
            workflow-runtime-example-temporal-worker
          timeout 240s docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            run --rm --no-deps workflow-runtime-example-runner --mode resume \
            | tee ci-artifacts/workflow-runtime-example/resume.json
      - name: Validate and export example-only evidence
        run: |
          timeout 120s docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            run --rm --no-deps workflow-runtime-example-runner \
            --mode validate-evidence >/dev/null
          docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            run --rm --no-deps --entrypoint cat workflow-runtime-example-runner \
            /evidence/workflow-runtime-example-v1.json \
            > ci-artifacts/workflow-runtime-example/evidence.json
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("ci-artifacts/workflow-runtime-example/evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          temporal = evidence["runtimes"]["temporal"]["scenarios"]
          required = {"failure", "approval", "cancel", "crash", "resume"}
          if set(temporal) != required:
              raise SystemExit("workflow runtime example scenarios incomplete")
          if temporal["crash"]["status"] != "worker_sigkill_completed":
              raise SystemExit("hard worker crash was not evidenced")
          if temporal["resume"]["terminal_status"] != "completed":
              raise SystemExit("durable resume did not complete")
          if evidence["production_release_gate"] is not False:
              raise SystemExit("example evidence must never become release evidence")
          PY
      - name: Collect Compose diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts/workflow-runtime-example
          docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            ps -a > ci-artifacts/workflow-runtime-example/compose-ps.txt || true
          docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            logs --no-color \
            > ci-artifacts/workflow-runtime-example/compose.log 2>&1 || true
      - name: Upload example evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-runtime-example
          path: ci-artifacts/workflow-runtime-example/
          if-no-files-found: warn
          retention-days: 7
      - name: Tear down disposable example
        if: always()
        run: |
          timeout 120s docker compose \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.workflow-runtime-example.yml \
            --profile temporal --profile workflow-runtime-example \
            down --volumes --remove-orphans

  workflow-runtime-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.13@sha256:5a65324fe84dc41709ff914e90b07f3e2f577073ed27bf917d4873aca0c9ec51
        env:
          POSTGRES_DB: ananta_workflow_contract
          POSTGRES_PASSWORD: workflow-contract-password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ananta_workflow_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:workflow-contract-password@127.0.0.1:5432/ananta_workflow_contract
      ANANTA_TEST_WORKFLOW_POSTGRES_URL: postgresql+psycopg2://postgres:workflow-contract-password@127.0.0.1:5432/ananta_workflow_contract
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
      - name: Exercise PostgreSQL head, N-1 and head migration path
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic current --check-heads
      - name: Run identical SQLite and PostgreSQL runtime-store contracts
        run: pytest -q tests/test_workflow_runtime_sqlalchemy_stores.py

  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
