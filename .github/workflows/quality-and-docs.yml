      ANANTA_WORKFLOW_WORKER_LANGGRAPH_REGISTRATION_TOKEN_SECRET_FILE: /tmp/ananta-compose-secrets/workflow-worker-langgraph-registration-token
      ANANTA_WORKFLOW_WORKER_LANGGRAPH_SERVICE_TOKEN_SECRET_FILE: /tmp/ananta-compose-secrets/workflow-worker-langgraph-service-token
      ANANTA_WORKER_LANGGRAPH_SESSION_SIGNING_KEY_SECRET_FILE: /tmp/ananta-compose-secrets/workflow-worker-langgraph-session-signing-key
      ANANTA_WORKFLOW_RUNTIME_SERVICE_KEYRING_SECRET_FILE: /tmp/ananta-compose-secrets/workflow-runtime-service-keyring.json
