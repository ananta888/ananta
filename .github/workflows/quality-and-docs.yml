      ANANTA_WORKFLOW_WORKER_BETA_REGISTRATION_TOKEN_SECRET_FILE: /tmp/ananta-compose-secrets/workflow-worker-beta-registration-token
      ANANTA_WORKFLOW_WORKER_ALPHA_SERVICE_TOKEN_SECRET_FILE: /tmp/ananta-compose-secrets/workflow-worker-alpha-service-token
      ANANTA_WORKFLOW_WORKER_BETA_SERVICE_TOKEN_SECRET_FILE: /tmp/ananta-compose-secrets/workflow-worker-beta-service-token
      ANANTA_WORKER_ALPHA_SESSION_SIGNING_KEY_SECRET_FILE: /tmp/ananta-compose-secrets/workflow-worker-alpha-session-signing-key
