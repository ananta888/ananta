      ANANTA_EXAMPLE_LIVE_PROVIDER_API_KEY_FILE: /tmp/ananta-compose-secrets/workflow-runtime-live-provider-token
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare compose artifact directory
        run: mkdir -p ci-artifacts/compose
      - name: Prepare non-production Compose secret fixtures
        run: |
          install -d -m 0700 /tmp/ananta-compose-secrets
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/ananta-compose-secrets")
          alpha_registration = "ci-alpha-registration-token-0123456789abcdef"
          beta_registration = "ci-beta-registration-token-0123456789abcdefg"
          langgraph_registration = "ci-langgraph-registration-token-0123456789abcdef"
          alpha_service = "ci-alpha-service-token-0123456789abcdef"
          beta_service = "ci-beta-service-token-0123456789abcdefg"
          langgraph_service = "ci-langgraph-service-token-0123456789abcdef"
          alpha_session = "ci-alpha-session-key-0123456789abcdef"
          beta_session = "ci-beta-session-key-0123456789abcdefg"
          langgraph_session = "ci-langgraph-session-key-0123456789abcdef"
          temporal_service = "ci-temporal-service-token-0123456789abcdef"

          def digest(value):
              return hashlib.sha256(value.encode("utf-8")).hexdigest()

          fixtures = {
              "workflow-auth-keyring.json": json.dumps({
                  "active_key_id": "ci-auth",
                  "keys": {"ci-auth": "ci-auth-key-0123456789abcdef0123456789"},
              }),
              "workflow-dispatch-keyring.json": json.dumps({
                  "active_key_id": "ci-dispatch",
                  "keys": {"ci-dispatch": "Y2ktZGlzcGF0Y2gta2V5LTAxMjM0NTY3ODlhYmNkZWY="},
              }),
              "workflow-hub-service-token": "ci-hub-token-0123456789abcdef0123456789",
              "workflow-hub-session-signing-key": "ci-hub-session-key-0123456789abcdef012345",
              "workflow-auth-signing-keyring.json": json.dumps({
                  "schema": "ananta.workflow-authorization-ed25519-keyring.v1",
                  "active_key_id": "ci-auth",
                  "keys": {"ci-auth": "ci-render-only-signing-key"},
              }),
              "workflow-auth-verification-keyring.json": json.dumps({
                  "schema": "ananta.workflow-authorization-ed25519-keyring.v1",
                  "keys": {"ci-auth": "ci-render-only-verification-key"},
              }),
              "workflow-worker-alpha-registration-token": alpha_registration,
              "workflow-worker-beta-registration-token": beta_registration,
              "workflow-worker-langgraph-registration-token": langgraph_registration,
              "workflow-worker-alpha-service-token": alpha_service,
              "workflow-worker-beta-service-token": beta_service,
              "workflow-worker-langgraph-service-token": langgraph_service,
              "workflow-worker-alpha-session-signing-key": alpha_session,
              "workflow-worker-beta-session-signing-key": beta_session,
              "workflow-worker-langgraph-session-signing-key": langgraph_session,
              "workflow-worker-registration-keyring.json": json.dumps({
                  "schema": "ananta.workflow-worker-registration-keyring.v1",
                  "workers": {
                      "ananta-worker-1": {
                          "worker_url": "http://ai-agent-alpha:5000",
                          "registration_token": alpha_registration,
                          "service_token_sha256": digest(alpha_service),
                          "session_signing_key_sha256": digest(alpha_session),
                          "allowed_capabilities": ["workflow.adapter.native"],
                      },
                      "ananta-worker-2": {
                          "worker_url": "http://ai-agent-beta:5000",
                          "registration_token": beta_registration,
                          "service_token_sha256": digest(beta_service),
                          "session_signing_key_sha256": digest(beta_session),
                          "allowed_capabilities": ["workflow.adapter.native"],
                      },
                      "ananta-langgraph-worker-1": {
                          "worker_url": "http://ai-agent-langgraph-worker:5000",
                          "registration_token": langgraph_registration,
                          "service_token_sha256": digest(langgraph_service),
                          "session_signing_key_sha256": digest(langgraph_session),
                          "allowed_capabilities": ["workflow.adapter.langgraph"],
                      },
                  },
              }),
              "workflow-temporal-service-token": temporal_service,
              "workflow-runtime-service-keyring.json": json.dumps({
                  "schema": "ananta.workflow-runtime-service-keyring.v1",
                  "services": {
                      "ananta-temporal-worker": {
                          "token": temporal_service,
                          "scopes": ["workflow.temporal.tasks"],
                      },
                  },
              }),
              "workflow-runtime-live-provider-token": "ci-local-provider-token",
          }
          for name, value in fixtures.items():
              path = root / name
              path.write_text(value + "\n", encoding="utf-8")
              path.chmod(0o600)
          PY
      - name: Validate Compose-next quickstart config
        run: docker compose -f docker/compose-next/compose.stack.quickstart.yml config > ci-artifacts/compose/compose-next-quickstart.yml
      - name: Validate legacy GitHub CI compose config without Ollama
        run: docker compose -f docker/old_way/docker-compose.base.yml -f docker/old_way/docker-compose-lite.yml -f docker/old_way/docker-compose.github-ci.yml config > ci-artifacts/compose/compose-github-ci.yml
      - name: Validate Compose-next distributed config
        run: docker compose -f docker/compose-next/compose.stack.distributed.yml config > ci-artifacts/compose/compose-next-distributed.yml
      - name: Validate optional Qdrant overlay
        run: |
          install -d -m 0700 /tmp/ananta-compose-secrets
          printf '%s' 'compose-validation-only' > /tmp/ananta-compose-secrets/qdrant-api-key
          chmod 0600 /tmp/ananta-compose-secrets/qdrant-api-key
          ANANTA_QDRANT_API_KEY_FILE=/tmp/ananta-compose-secrets/qdrant-api-key \
            docker compose \
              -f docker/compose-next/compose.stack.quickstart.yml \
              -f docker/compose-next/compose.qdrant.yml \
              --profile qdrant \
              config \
              > ci-artifacts/compose/compose-next-qdrant.yml
      - name: Validate Compose-next production Native runtime
        run: >
          docker compose
          -f docker/compose-next/compose.stack.full.yml
          -f docker/compose-next/compose.workflow-runtime.production.yml
          -f docker/compose-next/compose.native.production.yml
          config
          > ci-artifacts/compose/compose-next-workflow-native-production.yml
      - name: Validate Compose-next production LangGraph runtime
        run: >
          docker compose
          -f docker/compose-next/compose.stack.full.yml
          -f docker/compose-next/compose.workflow-runtime.production.yml
          -f docker/compose-next/compose.langgraph.production.yml
          --profile langgraph config
          > ci-artifacts/compose/compose-next-workflow-langgraph-production.yml
      - name: Validate Compose-next full stack with Temporal runtime
        run: >
          docker compose
          -f docker/compose-next/compose.stack.full.yml
          -f docker/compose-next/compose.temporal.yml
          --profile temporal config
          > ci-artifacts/compose/compose-next-workflow-temporal.yml
      - name: Validate Compose-next production Temporal secret wiring
        run: >
          docker compose
          -f docker/compose-next/compose.stack.full.yml
          -f docker/compose-next/compose.workflow-runtime.production.yml
          -f docker/compose-next/compose.temporal.yml
          -f docker/compose-next/compose.temporal.production.yml
          --profile temporal config
          > ci-artifacts/compose/compose-next-workflow-temporal-production.yml
      - name: Validate self-contained workflow-runtime example
        run: >
          docker compose
          -f docker/compose-next/compose.workflow-runtime-example.yml
          config
          > ci-artifacts/compose/compose-next-workflow-runtime-example.yml
      - name: Validate optional local live-provider example overlay
        run: >
          docker compose
          -f docker/compose-next/compose.workflow-runtime-example.yml
          -f docker/compose-next/compose.workflow-runtime-example.live-provider.yml
          --profile workflow-runtime-live-provider config
          > ci-artifacts/compose/compose-next-workflow-runtime-live-provider.yml
      - name: Upload compose config artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ananta-compose-configs
          path: ci-artifacts/compose/*.yml
          retention-days: 3

  temporal-compose-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEMPORAL_POSTGRES_PASSWORD: test-temporal-postgres-password
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install Temporal Test Environment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock temporalio==1.30.0
      - name: Run mandatory Temporal SDK failure and replay gate
        run: |
          mkdir -p ci-artifacts/temporal-failure-gate
          pytest -q tests/workflow_runtime/temporal \
            --junitxml=ci-artifacts/temporal-failure-gate/test-environment.xml
          cp tests/workflow_runtime/temporal/failure_scenarios.v1.json \
            ci-artifacts/temporal-failure-gate/scenario-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("ci-artifacts/temporal-failure-gate")
          manifest = json.loads((root / "scenario-manifest.json").read_text(encoding="utf-8"))
          summary = {
              "schema": "ananta.temporal-test-environment-gate-summary.v1",
              "status": "passed",
              "scenario_count": len(manifest["scenarios"]),
              "critical_race_minimum_repetitions": manifest[
                  "critical_race_minimum_repetitions"
              ],
              "n_minus_one_replay_release_blocking": manifest["release_requirements"][
                  "n_minus_one_replay"
              ],
              "result_artifact": "test-environment.xml",
          }
          (root / "test-environment-summary.json").write_text(
              json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Start real Temporal server and worker
        run: >
          docker compose --project-name ananta-temporal-gate
          -f docker/compose-next/compose.temporal.yml
          -f docker/compose-next/compose.tests.temporal.yml
          --profile temporal --profile temporal-test
          up -d --build --wait temporal-db temporal ananta-temporal-worker
      - name: Run registration and task-queue probe
        run: >
          docker compose --project-name ananta-temporal-gate
          -f docker/compose-next/compose.temporal.yml
          -f docker/compose-next/compose.tests.temporal.yml
          --profile temporal --profile temporal-test
          run --rm temporal-smoke
      - name: Collect Compose start and signal P95 samples
        run: |
          mkdir -p ci-artifacts/temporal-failure-gate
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            --profile temporal --profile temporal-test \
            run --rm temporal-performance \
            | tee ci-artifacts/temporal-failure-gate/performance-temporal.jsonl
      - name: Collect Hub event-projection P95 samples
        run: |
          python scripts/run-workflow-runtime-performance-gate.py \
            sample-projection --count 20 \
            --output ci-artifacts/temporal-failure-gate/performance-projection.json
      - name: Start in-flight durable recovery probe
        run: |
          mkdir -p ci-artifacts/temporal-failure-gate
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            --profile temporal --profile temporal-test \
            run --rm -e ANANTA_TEMPORAL_SMOKE_MODE=start-recovery temporal-smoke \
            | tee ci-artifacts/temporal-failure-gate/server-restart-start.jsonl
      - name: Restart real Temporal server with workflow in flight
        run: |
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            restart temporal
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            --profile temporal --profile temporal-test \
            up -d --wait temporal ananta-temporal-worker
      - name: Resume same workflow and confirm durable end state
        run: |
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            --profile temporal --profile temporal-test \
            run --rm -e ANANTA_TEMPORAL_SMOKE_MODE=complete-recovery temporal-smoke \
            | tee ci-artifacts/temporal-failure-gate/server-restart-complete.jsonl
      - name: Start second in-flight probe before hard worker crash
        run: |
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            --profile temporal --profile temporal-test \
            run --rm \
            -e ANANTA_TEMPORAL_SMOKE_MODE=start-recovery \
            -e ANANTA_TEMPORAL_RECOVERY_PROBE_ID=ananta-compose-worker-crash-probe-v1 \
            temporal-smoke \
            | tee ci-artifacts/temporal-failure-gate/worker-crash-start.jsonl
      - name: Hard-kill and replace real Temporal worker container
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          Path("ci-artifacts/temporal-failure-gate/worker-restart-start-ns").write_text(
              str(time.time_ns()), encoding="utf-8"
          )
          PY
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            kill -s SIGKILL ananta-temporal-worker
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            --profile temporal --profile temporal-test \
            up -d --wait ananta-temporal-worker
      - name: Resume same workflow after hard worker replacement
        run: |
          docker compose --project-name ananta-temporal-gate \
            -f docker/compose-next/compose.temporal.yml \
            -f docker/compose-next/compose.tests.temporal.yml \
            --profile temporal --profile temporal-test \
            run --rm \
            -e ANANTA_TEMPORAL_SMOKE_MODE=complete-recovery \
            -e ANANTA_TEMPORAL_RECOVERY_PROBE_ID=ananta-compose-worker-crash-probe-v1 \
            temporal-smoke \
            | tee ci-artifacts/temporal-failure-gate/worker-crash-complete.jsonl
      - name: Gate Compose P95 performance evidence
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          root = Path("ci-artifacts/temporal-failure-gate")
          started_ns = int((root / "worker-restart-start-ns").read_text(encoding="utf-8"))
          elapsed_ms = max(0.0, (time.time_ns() - started_ns) / 1_000_000.0)
          component = {
              "schema": "ananta.workflow_runtime_performance_samples.v1",
              "component": "worker_restart_resume",
              "runtime_id": "temporal",
              "reference_profile": "docker-compose-temporal-reference-v1",
              "sample_count": 1,
              "metrics": {"worker_restart_resume": {"samples_ms": [elapsed_ms]}},
          }
          (root / "performance-worker-restart.json").write_text(
              json.dumps(component, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python scripts/run-workflow-runtime-performance-gate.py evaluate \
            --component ci-artifacts/temporal-failure-gate/performance-temporal.jsonl \
            --component ci-artifacts/temporal-failure-gate/performance-projection.json \
            --component ci-artifacts/temporal-failure-gate/performance-worker-restart.json \
            --source-revision "${GITHUB_SHA}" \
            --output ci-artifacts/temporal-failure-gate/compose-performance-evidence.json
      - name: Validate and structure restart evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("ci-artifacts/temporal-failure-gate")

          def evidence(name):
              values = []
              for line in (root / name).read_text(encoding="utf-8").splitlines():
                  try:
                      value = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if value.get("schema") == "ananta.temporal-compose-recovery-evidence.v1":
                      values.append(value)
              if len(values) != 1:
                  raise SystemExit(f"exactly one recovery evidence record required in {name}")
              return values[0]

          def validate(scenario_id, prefix, output_name):
              started = evidence(f"{prefix}-start.jsonl")
              completed = evidence(f"{prefix}-complete.jsonl")
              for key in ("workflow_id", "run_id", "request_id", "task_queue", "namespace"):
                  if not started.get(key) or started[key] != completed.get(key):
                      raise SystemExit(f"{scenario_id} recovery binding mismatch: {key}")
              if started["status"] != "waiting_before_restart":
                  raise SystemExit(f"{scenario_id} was not in flight before failure")
              if completed["status"] != "completed_after_restart":
                  raise SystemExit(f"{scenario_id} did not complete after recovery")
              if started["rejected_release_count"] or completed["rejected_release_count"]:
                  raise SystemExit(f"{scenario_id} observed an unexpected release")
              report = {
                  "schema": "ananta.temporal-failure-gate-evidence.v1",
                  "scenario_id": scenario_id,
                  "status": "passed",
                  "started": started,
                  "completed": completed,
              }
              (root / output_name).write_text(
                  json.dumps(report, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              return report

          reports = [
              validate(
                  "temporal_server_restart_inflight_recovery",
                  "server-restart",
                  "server-restart-evidence.json",
              ),
              validate(
                  "worker_process_loss_history_replay",
                  "worker-crash",
                  "worker-crash-evidence.json",
              ),
          ]
          (root / "compose-gate-summary.json").write_text(
              json.dumps(
                  {
                      "schema": "ananta.temporal-compose-failure-gate-summary.v1",
                      "status": "passed",
                      "scenarios": reports,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify fresh task-queue probe after recovery
        run: >
          docker compose --project-name ananta-temporal-gate
          -f docker/compose-next/compose.temporal.yml
          -f docker/compose-next/compose.tests.temporal.yml
          --profile temporal --profile temporal-test
          run --rm temporal-smoke
      - name: Upload Temporal failure-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporal-failure-gate-evidence
          path: ci-artifacts/temporal-failure-gate/
          retention-days: 7
      - name: Tear down Temporal gate
        if: always()
        run: >
          docker compose --project-name ananta-temporal-gate
          -f docker/compose-next/compose.temporal.yml
          -f docker/compose-next/compose.tests.temporal.yml
          --profile temporal --profile temporal-test
          down --volumes --remove-orphans

  workflow-runtime-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install all optional workflow-runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements.lock \
            -r requirements-dev.lock \
            temporalio==1.30.0
          pip install -r docker/compose-next/requirements.langgraph-worker.lock
          python -c "from importlib.metadata import version; assert version('langgraph') == '0.2.76'; assert version('temporalio') == '1.30.0'"
          pip check
      - name: Run mandatory workflow-runtime release gate
        run: |
          mkdir -p ci-artifacts/workflow-runtime-release-gate
          python scripts/run-workflow-runtime-release-gate.py \
            --output ci-artifacts/workflow-runtime-release-gate/result.json
      - name: Upload workflow-runtime release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-runtime-release-gate
          path: ci-artifacts/workflow-runtime-release-gate/result.json
          if-no-files-found: error
          retention-days: 14

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POSTGRES_PASSWORD: test-postgres-password
      INITIAL_ADMIN_PASSWORD: test123
      SECRET_KEY: test-secret-key-with-at-least-thirty-two-chars
      AGENT_TOKEN_HUB: hub-token
      AGENT_TOKEN_ALPHA: alpha-token
      AGENT_TOKEN_BETA: beta-token
      AGENT_TOKEN_GAMMA: gamma-token
      AGENT_TOKEN_DELTA: delta-token
      GRAFANA_PASSWORD: test-grafana-password
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
      - name: Install domain audit deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run domain integration audit
        id: domain_audit
        continue-on-error: true
        run: python scripts/audit_domain_integrations.py --out ci-artifacts/domain-runtime/domain-integration-audit-report.json
      - name: Upload domain integration audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ananta-domain-integration-audit
          path: ci-artifacts/domain-runtime/domain-integration-audit-report.json
          retention-days: 14
      - name: Enforce domain integration audit
        if: steps.domain_audit.outcome == 'failure'
        run: exit 1
      - name: Run release reproducibility gate
        run: python scripts/release_gate.py --strict --compose-config --report release-verification-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ananta-release-verification-report
          path: |
            release-verification-report.json
            ci-artifacts/client-surface-release-gate.json
            ci-artifacts/domain-runtime/domain-integration-audit-report.json
          retention-days: 14

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
      - run: python devtools/check_markdown_links.py

  architecture-diagrams:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
      - run: npm install -g @mermaid-js/mermaid-cli@11.12.0
      - run: mkdir -p architektur/rendered
      - run: |
          for f in architektur/uml/*.mmd; do
            out="architektur/rendered/$(basename "${f%.mmd}.png")"
            mmdc -p architektur/puppeteer-config.json -i "$f" -o "$out" -b transparent
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ananta-architecture-diagrams
          path: architektur/rendered/*.png
          retention-days: 7
