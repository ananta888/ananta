[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ananta-sfu-runtime-agent"
version = "0.1.0"
description = "Optional mTLS SFU runtime extension boundary for Ananta"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography==43.0.3",
  "requests==2.32.3",
]

[project.scripts]
ananta-sfu-control-server = "ananta_sfu_runtime.control_server:main"
ananta-sfu-enroll = "ananta_sfu_runtime.enrollment_client:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
