name: Training backend NVIDIA acceptance

on:
  workflow_dispatch:
    inputs:
      evidence_path:
        description: Existing bounded acceptance evidence to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-evidence:
    runs-on: [self-hosted, linux, x64, nvidia]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate supplied evidence
        env:
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: python scripts/run_training_backends_acceptance.py "$EVIDENCE_PATH" --print-sha256
