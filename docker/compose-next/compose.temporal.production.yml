services:
  ai-agent-hub:
    environment:
      AGENT_TOKEN_FILE: /run/secrets/workflow_hub_service_token
      ANANTA_ORCHESTRATION_BACKEND: temporal
      ANANTA_WORKFLOW_BACKEND: temporal
      ANANTA_TEMPORAL_ADDRESS: temporal:7233
      ANANTA_TEMPORAL_WORKER_HEALTH_URL: http://ananta-temporal-worker:8088/ready
      ANANTA_TEMPORAL_NAMESPACE: ${ANANTA_TEMPORAL_NAMESPACE:-default}
      ANANTA_TEMPORAL_TASK_QUEUE: ${ANANTA_TEMPORAL_TASK_QUEUE:-ananta-workflows-v1}
      ANANTA_TEMPORAL_WORKFLOW_TYPE: ${ANANTA_TEMPORAL_WORKFLOW_TYPE:-AnantaWorkflow}
      ANANTA_WORKFLOW_AUTH_SIGNING_KEYRING_FILE: /run/secrets/workflow_runtime_auth_signing_keyring
      ANANTA_WORKFLOW_DISPATCH_KEYRING_FILE: /run/secrets/workflow_runtime_dispatch_keyring
    secrets:
      - source: workflow_runtime_auth_signing_keyring
        target: workflow_runtime_auth_signing_keyring
        mode: 0440
      - source: workflow_runtime_dispatch_keyring
        target: workflow_runtime_dispatch_keyring
        mode: 0440
      - source: workflow_hub_service_token
        target: workflow_hub_service_token
        mode: 0440
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - default
      - temporal-runtime

  ananta-temporal-worker:
    environment:
      ANANTA_WORKFLOW_AUTH_VERIFICATION_KEYRING_FILE: /run/secrets/workflow_runtime_auth_verification_keyring
      ANANTA_TEMPORAL_HUB_URL: http://ai-agent-hub:5000
      ANANTA_TEMPORAL_HUB_TOKEN_FILE: /run/secrets/workflow_hub_service_token
    secrets:
      - source: workflow_runtime_auth_verification_keyring
        target: workflow_runtime_auth_verification_keyring
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: workflow_hub_service_token
        target: workflow_hub_service_token
        uid: "10001"
        gid: "10001"
        mode: 0440
    depends_on:
      ai-agent-hub:
        condition: service_healthy

  # The production overlay deliberately keeps Temporal control/diagnostic
  # ports loopback-only.  Angular and normal workers never join this network.
  temporal:
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_PORT:-7233}:7233"

  temporal-ui:
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"

secrets:
  workflow_runtime_auth_signing_keyring:
    file: "${ANANTA_WORKFLOW_AUTH_SIGNING_KEYRING_SECRET_FILE:?Error: auth signing keyring secret file must be set}"
  workflow_runtime_auth_verification_keyring:
    file: "${ANANTA_WORKFLOW_AUTH_VERIFICATION_KEYRING_SECRET_FILE:?Error: auth verification keyring file must be set}"
  workflow_runtime_dispatch_keyring:
    file: "${ANANTA_WORKFLOW_DISPATCH_KEYRING_SECRET_FILE:?Error: dispatch keyring secret file must be set}"
  workflow_hub_service_token:
    file: "${ANANTA_WORKFLOW_HUB_TOKEN_SECRET_FILE:?Error: Hub service-token secret file must be set}"
