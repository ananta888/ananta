services:
  lora-training-worker-autotrain:
    extends:
      file: compose.lora-training.yml
      service: lora-training-worker-nvidia
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.training-autotrain
    image: ananta-training-autotrain:0.8.36-local
    profiles: [training-autotrain-experimental]
    environment:
      ANANTA_LORA_TRAINING_BACKENDS: autotrain
      ANANTA_LORA_TRAINING_RESOURCE_PROFILE: nvidia
    networks:
      lora-training-control:
        aliases: [lora-training-worker]

networks:
  lora-training-control:
    internal: true

volumes:
  lora-training-state: {}
