services:
  ai-agent-hub:
    extends:
      file: compose.base.yml
      service: ai-agent-hub-base
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ananta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ananta}"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Parallel decision runner 2: llama-server Vulkan, Windows-native on the AMD 780M (port 18152).
      # 172.18.112.1 = Windows host seen from WSL NAT (default route). Recheck after Windows/WSL reboots.
      ANANTA_PARALLEL_DECISION_URL2: http://172.18.112.1:18152
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-agent-alpha:
    extends:
      file: compose.base.yml
      service: ai-agent-worker-base
    environment:
      AGENT_NAME: ${ANANTA_WORKER_ALPHA_ID:-ananta-worker-1}
      ANANTA_KNOWLEDGE_INDEX_WORKER_ID: ${ANANTA_WORKER_ALPHA_ID:-ananta-worker-1}
      # CLI backend for delegated execution; lets one image run an opencode
      # and an ananta-worker backend side by side (per-worker override).
      # ANANTA_SGPT_ROUTING_* governs the task-scoped propose route,
      # SGPT_EXECUTION_BACKEND the execute route the self-development path uses.
      ANANTA_SGPT_ROUTING_DEFAULT_BACKEND: ${ANANTA_WORKER_ALPHA_CLI_BACKEND:-ananta-worker}
      # resolve_cli_backend reads task_kind_backend BEFORE default_backend, so the
      # per-kind map must name the backend for this worker as well (coding runs
      # through task_kind=coding). research keeps its deerflow default.
      # L6 variant A: the map names the STRUCTURE backend — ananta-worker routes
      # the kind through the mutation loop, and ANANTA_WORKSPACE_MUTATION_LLM_BACKEND
      # below makes opencode that loop's brain. ANANTA_WORKER_ALPHA_TASK_KIND_CODE
      # = opencode switches the kind back to the native opencode path (loop
      # bypassed) as the comparison flag.
      ANANTA_SGPT_ROUTING_TASK_KIND_BACKEND: '{"coding":"${ANANTA_WORKER_ALPHA_TASK_KIND_CODE:-ananta-worker}","analysis":"${ANANTA_WORKER_ALPHA_TASK_KIND_CODE:-ananta-worker}","doc":"${ANANTA_WORKER_ALPHA_TASK_KIND_CODE:-ananta-worker}","ops":"${ANANTA_WORKER_ALPHA_TASK_KIND_CODE:-ananta-worker}","research":"deerflow"}'
      SGPT_EXECUTION_BACKEND: ${ANANTA_WORKER_ALPHA_CLI_BACKEND:-ananta-worker}
      # Schema-constrained mutation answers (code default off; on for this stack).
      ANANTA_WORKSPACE_MUTATION_STRUCTURED_OUTPUT: ${ANANTA_WORKER_STRUCTURED_OUTPUT:-1}
      # L6 variant A: opencode answers the loop's protocol turns (brain, not path).
      ANANTA_WORKSPACE_MUTATION_LLM_BACKEND: ${ANANTA_WORKER_ALPHA_MUTATION_BRAIN:-opencode}
      ANANTA_SOURCE_INDEX_RUNTIME_TARGET_JSON: '{"runtime_target_id":"source-index-alpha","runtime_id":"codecompass-index","runtime_kind":"docker_container","provider_id":"opencode","model_provider_id":"${ANANTA_SOURCE_INDEX_MODEL_PROVIDER_ID:-lmstudio}","model_ids":["${ANANTA_SOURCE_INDEX_MODEL_ID:-qwen2.5-3b-instruct}"],"provider_location":"local_container","data_residency":"local","model_class":"code","source_access_authorized":true,"global_source_access":true,"enabled":true,"worker_kind":"worker"}'
      AGENT_URL: http://ai-agent-alpha:5000
      # Worker agent processes inside this container (ports 5000..+N-1, own
      # name/URL/DATA_DIR per process). Default 1 keeps the one-process layout.
      ANANTA_AGENT_COUNT: ${ANANTA_WORKER_ALPHA_AGENT_COUNT:-1}
      HUB_URL: http://ai-agent-hub:5000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ananta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ananta}"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ../../project-workspaces:/project-workspaces:rw
      - alpha-data:/app/data
    depends_on:
      ai-agent-hub:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ai-agent-beta:
    extends:
      file: compose.base.yml
      service: ai-agent-worker-base
    environment:
      AGENT_NAME: ${ANANTA_WORKER_BETA_ID:-ananta-worker-2}
      ANANTA_KNOWLEDGE_INDEX_WORKER_ID: ${ANANTA_WORKER_BETA_ID:-ananta-worker-2}
      # Counterpart to the alpha backend: defaults to the ananta-worker loop.
      # ANANTA_SGPT_ROUTING_* governs the task-scoped propose route,
      # SGPT_EXECUTION_BACKEND the execute route the self-development path uses.
      ANANTA_SGPT_ROUTING_DEFAULT_BACKEND: ${ANANTA_WORKER_BETA_CLI_BACKEND:-ananta-worker}
      SGPT_EXECUTION_BACKEND: ${ANANTA_WORKER_BETA_CLI_BACKEND:-ananta-worker}
      # Schema-constrained mutation answers (code default off; on for this stack).
      ANANTA_WORKSPACE_MUTATION_STRUCTURED_OUTPUT: ${ANANTA_WORKER_STRUCTURED_OUTPUT:-1}
      ANANTA_SOURCE_INDEX_RUNTIME_TARGET_JSON: '{"runtime_target_id":"source-index-beta","runtime_id":"codecompass-index","runtime_kind":"docker_container","provider_id":"opencode","model_provider_id":"${ANANTA_SOURCE_INDEX_MODEL_PROVIDER_ID:-lmstudio}","model_ids":["${ANANTA_SOURCE_INDEX_MODEL_ID:-qwen2.5-3b-instruct}"],"provider_location":"local_container","data_residency":"local","model_class":"code","source_access_authorized":true,"global_source_access":true,"enabled":true,"worker_kind":"worker"}'
      AGENT_URL: http://ai-agent-beta:5000
      # Worker agent processes inside this container (ports 5000..+N-1, own
      # name/URL/DATA_DIR per process). Default 1 keeps the one-process layout.
      ANANTA_AGENT_COUNT: ${ANANTA_WORKER_BETA_AGENT_COUNT:-1}
      HUB_URL: http://ai-agent-hub:5000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ananta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ananta}"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ../../project-workspaces:/project-workspaces:rw
      - beta-data:/app/data
    depends_on:
      ai-agent-hub:
        condition: service_healthy
      postgres:
        condition: service_healthy

  angular-frontend:
    extends:
      file: compose.base.yml
      service: angular-frontend-base
    depends_on:
      ai-agent-hub:
        condition: service_healthy

  postgres:
    image: postgres:16.13@sha256:5a65324fe84dc41709ff914e90b07f3e2f577073ed27bf917d4873aca0c9ec51
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ananta}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-ananta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ananta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  hub-data:
  alpha-data:
  beta-data:
  postgres-data:
  redis-data:
  frontend-node-modules:
  frontend-angular-cache:
