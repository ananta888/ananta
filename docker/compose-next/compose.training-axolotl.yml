services:
  lora-training-worker-axolotl:
    extends:
      file: compose.lora-training.yml
      service: lora-training-worker-nvidia
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.training-axolotl
    image: ananta-training-axolotl:0.18.0-local
    profiles: [training-axolotl]
    environment:
      ANANTA_LORA_TRAINING_BACKENDS: axolotl
      ANANTA_LORA_TRAINING_RESOURCE_PROFILE: nvidia
    networks:
      lora-training-control:
        aliases: [lora-training-worker]

networks:
  lora-training-control:
    internal: true

volumes:
  lora-training-state: {}
