# Shared production credential boundary for every workflow runtime.
# Load this file immediately after compose.stack.full.yml and before any
# Native, LangGraph or Temporal runtime overlay.
services:
  ai-agent-hub:
    # Compose resolves `extends` after ordinary map merges. An explicit
    # allowlist prevents inherited development credentials from reappearing.
    environment: !override
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: hub
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:?Error: INITIAL_ADMIN_PASSWORD must be set in .env}"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_API_MODE: ${LMSTUDIO_API_MODE:-chat}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-lmstudio}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-180}
      COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-180}
      ANANTA_RUNTIME_PROFILE: ${ANANTA_RUNTIME_PROFILE:-compose-safe}
      SECRET_KEY_FILE: /run/secrets/workflow_hub_session_signing_key
      ROLE: hub
      AGENT_NAME: ${ANANTA_HUB_ID:-ananta-hub}
      AGENT_URL: http://ai-agent-hub:5000
      AGENT_TOKEN_FILE: /run/secrets/workflow_hub_service_token
      AGENT_TOKEN_PERSISTENCE: "0"
      AUTH_TEST_ENDPOINTS_ENABLED: "0"
      HUB_CAN_BE_WORKER: ${HUB_CAN_BE_WORKER:-0}
      CORS_ORIGINS: "${CORS_ORIGINS:?Error: CORS_ORIGINS must be an explicit production origin allowlist}"
      ANANTA_WORKSPACE_ROOT: /project-workspaces
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-3600}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ananta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ananta}"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANANTA_WORKFLOW_AUTH_SIGNING_KEYRING_FILE: /run/secrets/workflow_runtime_auth_signing_keyring
      ANANTA_WORKFLOW_DISPATCH_KEYRING_FILE: /run/secrets/workflow_runtime_dispatch_keyring
      ANANTA_WORKFLOW_REQUIRE_REGISTERED_WORKER_AUTH: "1"
      ANANTA_WORKFLOW_WORKER_REGISTRATION_KEYRING_FILE: /run/secrets/workflow_worker_registration_keyring
    secrets:
      - source: workflow_runtime_auth_signing_keyring
        target: workflow_runtime_auth_signing_keyring
        mode: 0400
      - source: workflow_runtime_dispatch_keyring
        target: workflow_runtime_dispatch_keyring
        mode: 0400
      - source: workflow_hub_service_token
        target: workflow_hub_service_token
        mode: 0400
      - source: workflow_hub_session_signing_key
        target: workflow_hub_session_signing_key
        mode: 0400
      - source: workflow_worker_registration_keyring
        target: workflow_worker_registration_keyring
        mode: 0400
    networks:
      - default
      - workflow-worker-control
      - workflow-ui-control

  ai-agent-alpha:
    environment: !override
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: worker
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_API_MODE: ${LMSTUDIO_API_MODE:-chat}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-lmstudio}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-180}
      COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-180}
      ANANTA_RUNTIME_PROFILE: ${ANANTA_RUNTIME_PROFILE:-compose-safe}
      SECRET_KEY_FILE: /run/secrets/workflow_worker_alpha_session_signing_key
      ROLE: worker
      AGENT_NAME: ${ANANTA_WORKER_ALPHA_ID:-ananta-worker-1}
      AGENT_URL: http://ai-agent-alpha:5000
      HUB_URL: http://ai-agent-hub:5000
      ANANTA_WORKSPACE_ROOT: /project-workspaces
      ANANTA_CODECOMPASS_DOMAIN_SUPPLEMENT_SOURCE_MAX_BYTES: ${ANANTA_CODECOMPASS_DOMAIN_SUPPLEMENT_SOURCE_MAX_BYTES:-2147483648}
      DISABLE_INITIAL_ADMIN: "1"
      AGENT_TOKEN_FILE: /run/secrets/workflow_worker_alpha_service_token
      AGENT_TOKEN_PERSISTENCE: "0"
      REGISTRATION_TOKEN_FILE: /run/secrets/workflow_worker_alpha_registration_token
      ANANTA_WORKFLOW_AUTH_VERIFICATION_KEYRING_FILE: /run/secrets/workflow_runtime_auth_verification_keyring
      ANANTA_WORKFLOW_HUB_URL: http://ai-agent-hub:5000
      ANANTA_WORKFLOW_HUB_TOKEN_FILE: /run/secrets/workflow_worker_alpha_service_token
      ANANTA_WORKFLOW_ADAPTER_WORKER_PROFILE_FILE: /app/config/workflow_runtime/native_worker_profile.v1.json
      ANANTA_SEMANTIC_COMPUTE_WORKER_ENABLED: ${ANANTA_SEMANTIC_COMPUTE_WORKER_ENABLED:-false}
    depends_on:
      postgres: !reset null
    ports: !reset []
    networks: !override
      - workflow-worker-control
    # A production Worker must never receive the Hub's host bind or another
    # Worker's writable tree. The dedicated volume is the complete filesystem
    # boundary visible below ANANTA_WORKSPACE_ROOT for this identity.
    volumes: !override
      - type: volume
        source: workflow_worker_alpha_workspace
        target: /project-workspaces
        volume:
          nocopy: true
      - type: volume
        source: alpha-data
        target: /app/data
        volume:
          nocopy: true
    secrets:
      - source: workflow_runtime_auth_verification_keyring
        target: workflow_runtime_auth_verification_keyring
        mode: 0444
      - source: workflow_worker_alpha_registration_token
        target: workflow_worker_alpha_registration_token
        mode: 0400
      - source: workflow_worker_alpha_service_token
        target: workflow_worker_alpha_service_token
        mode: 0400
      - source: workflow_worker_alpha_session_signing_key
        target: workflow_worker_alpha_session_signing_key
        mode: 0400

  ai-agent-beta:
    environment: !override
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: worker
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_API_MODE: ${LMSTUDIO_API_MODE:-chat}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-lmstudio}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-180}
      COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-180}
      ANANTA_RUNTIME_PROFILE: ${ANANTA_RUNTIME_PROFILE:-compose-safe}
      SECRET_KEY_FILE: /run/secrets/workflow_worker_beta_session_signing_key
      ROLE: worker
      AGENT_NAME: ${ANANTA_WORKER_BETA_ID:-ananta-worker-2}
      AGENT_URL: http://ai-agent-beta:5000
      HUB_URL: http://ai-agent-hub:5000
      ANANTA_WORKSPACE_ROOT: /project-workspaces
      ANANTA_CODECOMPASS_DOMAIN_SUPPLEMENT_SOURCE_MAX_BYTES: ${ANANTA_CODECOMPASS_DOMAIN_SUPPLEMENT_SOURCE_MAX_BYTES:-2147483648}
      DISABLE_INITIAL_ADMIN: "1"
      AGENT_TOKEN_FILE: /run/secrets/workflow_worker_beta_service_token
      AGENT_TOKEN_PERSISTENCE: "0"
      REGISTRATION_TOKEN_FILE: /run/secrets/workflow_worker_beta_registration_token
      ANANTA_WORKFLOW_AUTH_VERIFICATION_KEYRING_FILE: /run/secrets/workflow_runtime_auth_verification_keyring
      ANANTA_WORKFLOW_HUB_URL: http://ai-agent-hub:5000
      ANANTA_WORKFLOW_HUB_TOKEN_FILE: /run/secrets/workflow_worker_beta_service_token
      ANANTA_WORKFLOW_ADAPTER_WORKER_PROFILE_FILE: /app/config/workflow_runtime/native_worker_profile.v1.json
      ANANTA_SEMANTIC_COMPUTE_WORKER_ENABLED: ${ANANTA_SEMANTIC_COMPUTE_WORKER_ENABLED:-false}
    depends_on:
      postgres: !reset null
    ports: !reset []
    networks: !override
      - workflow-worker-control
    volumes: !override
      - type: volume
        source: workflow_worker_beta_workspace
        target: /project-workspaces
        volume:
          nocopy: true
      - type: volume
        source: beta-data
        target: /app/data
        volume:
          nocopy: true
    secrets:
      - source: workflow_runtime_auth_verification_keyring
        target: workflow_runtime_auth_verification_keyring
        mode: 0444
      - source: workflow_worker_beta_registration_token
        target: workflow_worker_beta_registration_token
        mode: 0400
      - source: workflow_worker_beta_service_token
        target: workflow_worker_beta_service_token
        mode: 0400
      - source: workflow_worker_beta_session_signing_key
        target: workflow_worker_beta_session_signing_key
        mode: 0400

  angular-frontend:
    environment: !override
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: frontend
      ANANTA_FRONTEND_DISABLE_HOST_CHECK: "0"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes: !reset []
    networks: !override
      - workflow-ui-control

  # Production data planes are Hub-internal. Operators use the Hub APIs and
  # explicit backup tooling; neither unauthenticated Redis nor PostgreSQL is
  # published on the host.
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

secrets:
  workflow_runtime_auth_signing_keyring:
    file: "${ANANTA_WORKFLOW_AUTH_SIGNING_KEYRING_SECRET_FILE:?Error: auth signing keyring secret file must be set}"
  workflow_runtime_auth_verification_keyring:
    file: "${ANANTA_WORKFLOW_AUTH_VERIFICATION_KEYRING_SECRET_FILE:?Error: auth verification keyring file must be set}"
  workflow_runtime_dispatch_keyring:
    file: "${ANANTA_WORKFLOW_DISPATCH_KEYRING_SECRET_FILE:?Error: dispatch keyring secret file must be set}"
  workflow_hub_service_token:
    file: "${ANANTA_WORKFLOW_HUB_TOKEN_SECRET_FILE:?Error: Hub service-token secret file must be set}"
  workflow_hub_session_signing_key:
    file: "${ANANTA_HUB_SESSION_SIGNING_KEY_SECRET_FILE:?Error: Hub session signing-key secret file must be set}"
  workflow_worker_registration_keyring:
    file: "${ANANTA_WORKFLOW_WORKER_REGISTRATION_KEYRING_SECRET_FILE:?Error: Worker registration keyring secret file must be set}"
  workflow_worker_alpha_registration_token:
    file: "${ANANTA_WORKFLOW_WORKER_ALPHA_REGISTRATION_TOKEN_SECRET_FILE:?Error: alpha Worker registration-token secret file must be set}"
  workflow_worker_beta_registration_token:
    file: "${ANANTA_WORKFLOW_WORKER_BETA_REGISTRATION_TOKEN_SECRET_FILE:?Error: beta Worker registration-token secret file must be set}"
  workflow_worker_alpha_service_token:
    file: "${ANANTA_WORKFLOW_WORKER_ALPHA_SERVICE_TOKEN_SECRET_FILE:?Error: alpha Worker service-token secret file must be set}"
  workflow_worker_beta_service_token:
    file: "${ANANTA_WORKFLOW_WORKER_BETA_SERVICE_TOKEN_SECRET_FILE:?Error: beta Worker service-token secret file must be set}"
  workflow_worker_alpha_session_signing_key:
    file: "${ANANTA_WORKER_ALPHA_SESSION_SIGNING_KEY_SECRET_FILE:?Error: alpha Worker session signing-key secret file must be set}"
  workflow_worker_beta_session_signing_key:
    file: "${ANANTA_WORKER_BETA_SESSION_SIGNING_KEY_SECRET_FILE:?Error: beta Worker session signing-key secret file must be set}"

networks:
  # Workers need provider egress, but must not share the Hub's data-plane
  # network containing PostgreSQL and Redis.
  workflow-worker-control:
  # The browser-facing server only needs the Hub control plane. It cannot
  # resolve or connect directly to PostgreSQL, Redis, or worker containers.
  workflow-ui-control:

volumes:
  # Identity-local production workspaces. They are intentionally distinct from
  # the Hub bind mount and from one another; development Compose keeps its
  # shared bind mount for hot iteration.
  workflow_worker_alpha_workspace:
  workflow_worker_beta_workspace:
