services:
  ai-agent-hub:
    networks:
      - default
      - langgraph-runtime

  ai-agent-langgraph-worker:
    extends:
      file: compose.base.yml
      service: ai-agent-worker-base
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.quickstart-no-ollama
      args:
        INSTALL_LANGGRAPH_RUNTIME: "1"
    image: ${ANANTA_LANGGRAPH_WORKER_IMAGE:-ananta-langgraph-worker:local}
    profiles: ["langgraph"]
    environment: !override
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: worker
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_API_MODE: ${LMSTUDIO_API_MODE:-chat}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-lmstudio}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-180}
      COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-180}
      ANANTA_RUNTIME_PROFILE: ${ANANTA_RUNTIME_PROFILE:-compose-safe}
      SECRET_KEY_FILE: /run/secrets/workflow_worker_langgraph_session_signing_key
      ROLE: worker
      AGENT_NAME: ${ANANTA_LANGGRAPH_WORKER_ID:-ananta-langgraph-worker-1}
      AGENT_URL: http://ai-agent-langgraph-worker:5000
      HUB_URL: http://ai-agent-hub:5000
      ANANTA_WORKSPACE_ROOT: /project-workspaces
      DISABLE_INITIAL_ADMIN: "1"
      AGENT_TOKEN_FILE: /run/secrets/workflow_worker_langgraph_service_token
      AGENT_TOKEN_PERSISTENCE: "0"
      REGISTRATION_TOKEN_FILE: /run/secrets/workflow_worker_langgraph_registration_token
      ANANTA_LANGGRAPH_HUB_URL: http://ai-agent-hub:5000
      ANANTA_LANGGRAPH_HUB_TOKEN_FILE: /run/secrets/workflow_worker_langgraph_service_token
      ANANTA_WORKFLOW_ADAPTER_WORKER_PROFILE_FILE: /app/config/workflow_runtime/langgraph_worker_profile.v1.json
      ANANTA_WORKFLOW_AUTH_VERIFICATION_KEYRING_FILE: /run/secrets/workflow_runtime_auth_verification_keyring
    secrets:
      - source: workflow_runtime_auth_verification_keyring
        target: workflow_runtime_auth_verification_keyring
        mode: 0444
      - source: workflow_worker_langgraph_registration_token
        target: workflow_worker_langgraph_registration_token
        mode: 0400
      - source: workflow_worker_langgraph_service_token
        target: workflow_worker_langgraph_service_token
        mode: 0400
      - source: workflow_worker_langgraph_session_signing_key
        target: workflow_worker_langgraph_session_signing_key
        mode: 0400
    depends_on:
      ai-agent-hub:
        condition: service_healthy
    networks:
      - langgraph-runtime
    volumes: !override
      - type: volume
        source: workflow_langgraph_worker_workspace
        target: /project-workspaces
        volume:
          nocopy: true
      - type: volume
        source: langgraph-worker-data
        target: /app/data
        volume:
          nocopy: true

secrets:
  workflow_worker_langgraph_registration_token:
    file: "${ANANTA_WORKFLOW_WORKER_LANGGRAPH_REGISTRATION_TOKEN_SECRET_FILE:?Error: LangGraph Worker registration-token secret file must be set}"
  workflow_worker_langgraph_service_token:
    file: "${ANANTA_WORKFLOW_WORKER_LANGGRAPH_SERVICE_TOKEN_SECRET_FILE:?Error: LangGraph Worker service-token secret file must be set}"
  workflow_worker_langgraph_session_signing_key:
    file: "${ANANTA_WORKER_LANGGRAPH_SESSION_SIGNING_KEY_SECRET_FILE:?Error: LangGraph Worker session signing-key secret file must be set}"

volumes:
  langgraph-worker-data:
  workflow_langgraph_worker_workspace:

networks:
  langgraph-runtime:
