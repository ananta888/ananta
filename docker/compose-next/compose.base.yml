services:
  ai-agent-hub-base:
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.quickstart-no-ollama
      args:
        ANANTA_RUNTIME_UID: ${ANANTA_HOST_UID:-1000}
        ANANTA_RUNTIME_GID: ${ANANTA_HOST_GID:-1000}
    image: ${ANANTA_QUICKSTART_IMAGE:-ananta-quickstart-no-ollama:local}
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m agent.ai_agent
    environment:
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: hub
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
      FLASK_DEBUG: 0
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:?Error: INITIAL_ADMIN_PASSWORD must be set in .env}"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_API_MODE: ${LMSTUDIO_API_MODE:-chat}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-lmstudio}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_URL: ${OPENAI_URL:-https://api.openai.com/v1/chat/completions}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-180}
      COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-180}
      ANANTA_RUNTIME_PROFILE: ${ANANTA_RUNTIME_PROFILE:-compose-safe}
      ANANTA_USER_JSON: /app/data/user.json
      ANANTA_SOURCE_ACCESS_ALLOW_COMPOSE_SECRET_DERIVATION: "1"
      ANANTA_SOURCE_ACCESS_KEYRING_FILE: ${ANANTA_SOURCE_ACCESS_KEYRING_FILE:-}
      SECRET_KEY: ${SECRET_KEY:-ananta-dev-shared-secret-change-me}
      ROLE: hub
      AGENT_NAME: ${ANANTA_HUB_ID:-ananta-hub}
      AGENT_URL: http://ai-agent-hub:5000
      AUTH_TEST_ENDPOINTS_ENABLED: ${AUTH_TEST_ENDPOINTS_ENABLED:-0}
      HUB_CAN_BE_WORKER: ${HUB_CAN_BE_WORKER:-0}
      FEATURE_ANGULAR_KANBAN_ENABLED: ${FEATURE_ANGULAR_KANBAN_ENABLED:-0}
      FEATURE_ANGULAR_MODEL_DASHBOARD_ENABLED: ${FEATURE_ANGULAR_MODEL_DASHBOARD_ENABLED:-0}
      ANANTA_KANBAN_API_ENABLED: ${ANANTA_KANBAN_API_ENABLED:-0}
      ANANTA_KANBAN_WRITE_ENABLED: ${ANANTA_KANBAN_WRITE_ENABLED:-0}
      ANANTA_WORKSPACE_ROOT: /project-workspaces
      # Optional OIDC account linking. Hub endpoints still require Hub JWTs.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-3600}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256}
      # Hub-authoritative media admission remains fail-closed unless an
      # operator explicitly opts in through the Compose environment.
      ANANTA_ORDINARY_MEDIA_PUBLICATION_ENABLED: ${ANANTA_ORDINARY_MEDIA_PUBLICATION_ENABLED:-false}
      ANANTA_SEMANTIC_VISUAL_CAPTURE_ENABLED: ${ANANTA_SEMANTIC_VISUAL_CAPTURE_ENABLED:-false}
      ANANTA_SEMANTIC_SPEECH_RUNTIME_ENABLED: ${ANANTA_SEMANTIC_SPEECH_RUNTIME_ENABLED:-false}
      ANANTA_SEMANTIC_MEDIA_SFU_ENABLED: ${ANANTA_SEMANTIC_MEDIA_SFU_ENABLED:-false}
    ports:
      - "${HUB_PORT:-5000}:5000"
    volumes:
      - ../../project-workspaces:/project-workspaces:rw
      - hub-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health?basic=1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-agent-worker-base:
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.quickstart-no-ollama
      args:
        ANANTA_RUNTIME_UID: ${ANANTA_HOST_UID:-1000}
        ANANTA_RUNTIME_GID: ${ANANTA_HOST_GID:-1000}
    image: ${ANANTA_QUICKSTART_IMAGE:-ananta-quickstart-no-ollama:local}
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m agent.ai_agent
    environment:
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: worker
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
      FLASK_DEBUG: 0
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:?Error: INITIAL_ADMIN_PASSWORD must be set in .env}"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_API_MODE: ${LMSTUDIO_API_MODE:-chat}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-lmstudio}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-auto}
      CODEX_DEFAULT_MODEL: ${CODEX_DEFAULT_MODEL:-gpt-5-codex}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-180}
      COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-180}
      ANANTA_RUNTIME_PROFILE: ${ANANTA_RUNTIME_PROFILE:-compose-safe}
      ANANTA_SOURCE_ACCESS_ALLOW_COMPOSE_SECRET_DERIVATION: "1"
      ANANTA_SOURCE_ACCESS_KEYRING_FILE: ${ANANTA_SOURCE_ACCESS_KEYRING_FILE:-}
      SECRET_KEY: ${SECRET_KEY:-ananta-dev-shared-secret-change-me}
      ROLE: worker
      ANANTA_WORKSPACE_ROOT: /project-workspaces
      ANANTA_CODECOMPASS_DOMAIN_SUPPLEMENT_SOURCE_MAX_BYTES: ${ANANTA_CODECOMPASS_DOMAIN_SUPPLEMENT_SOURCE_MAX_BYTES:-2147483648}
    volumes:
      - ../../project-workspaces:/project-workspaces:rw

  angular-frontend-base:
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.quickstart-no-ollama
      args:
        ANANTA_RUNTIME_UID: ${ANANTA_HOST_UID:-1000}
        ANANTA_RUNTIME_GID: ${ANANTA_HOST_GID:-1000}
    image: ${ANANTA_QUICKSTART_IMAGE:-ananta-quickstart-no-ollama:local}
    restart: unless-stopped
    working_dir: /app/frontend-angular
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npx ng serve --host 0.0.0.0 --port 4200 --poll 2000 --disable-host-check
    environment:
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: frontend
      E2E_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      E2E_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:?Error: INITIAL_ADMIN_PASSWORD must be set in .env}"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    # Mount the host frontend-angular source read-only so ng serve observes
    # local edits without allowing the container to modify the checkout.
    # node_modules is read-only; only the separate .angular cache is writable.
    volumes:
      - ../../frontend-angular:/app/frontend-angular:ro
      - frontend-node-modules:/app/frontend-angular/node_modules:ro
      - frontend-angular-cache:/app/frontend-angular/.angular
