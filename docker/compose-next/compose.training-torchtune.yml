services:
  lora-training-worker-torchtune:
    extends:
      file: compose.lora-training.yml
      service: lora-training-worker-nvidia
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.training-torchtune
    image: ananta-training-torchtune:0.6.1-local
    profiles: [training-torchtune-experimental]
    environment:
      ANANTA_LORA_TRAINING_BACKENDS: torchtune
      ANANTA_LORA_TRAINING_RESOURCE_PROFILE: nvidia
    networks:
      lora-training-control:
        aliases: [lora-training-worker]

networks:
  lora-training-control:
    internal: true

volumes:
  lora-training-state: {}
