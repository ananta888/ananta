services:
  ai-agent-hub:
    extends:
      file: compose.base.yml
      service: ai-agent-hub-base
    environment:
      ANANTA_RESTRICTED_INFERENCE_ALLOWED_ENDPOINTS: http://restricted-inference-worker:8091/internal/v1/restricted-inference
      ANANTA_RESTRICTED_INFERENCE_URL: http://restricted-inference-worker:8091/internal/v1/restricted-inference
      ANANTA_RESTRICTED_INFERENCE_TOKEN: "${RESTRICTED_INFERENCE_INTERNAL_TOKEN:?RESTRICTED_INFERENCE_INTERNAL_TOKEN must contain at least 24 characters}"
      ANANTA_RESTRICTED_INFERENCE_MANIFEST_SCORE_CHOICES: ${ANANTA_RESTRICTED_INFERENCE_MANIFEST_SCORE_CHOICES:-}
      RESTRICTED_INFERENCE_INTERNAL_TOKEN: "${RESTRICTED_INFERENCE_INTERNAL_TOKEN:?RESTRICTED_INFERENCE_INTERNAL_TOKEN must contain at least 24 characters}"
      RESTRICTED_INFERENCE_RUNTIME_URL: http://restricted-inference-worker:8091
      RESTRICTED_INFERENCE_WORKER_URL: http://restricted-inference-worker:8091
      VOICE_DIRECT_CLIENT_ACCESS: "false"
      VOICE_DELETION_LEDGER_PATH: /app/data/voice-deletion-ledger.v1.jsonl
      VOICE_DELETION_LEDGER_SEGMENT_RECORDS: ${VOICE_DELETION_LEDGER_SEGMENT_RECORDS:-10000}
      VOICE_DELETION_LEDGER_MAX_RECORDS: ${VOICE_DELETION_LEDGER_MAX_RECORDS:-1000000}
      VOICE_GENERATIVE_JUDGE_HUB_ORIGIN: http://ai-agent-hub:5000
      VOICE_GENERATIVE_JUDGE_MAX_RESPONSE_BYTES: ${VOICE_GENERATIVE_JUDGE_MAX_RESPONSE_BYTES:-65536}
      VOICE_GENERATIVE_JUDGE_TIMEOUT_MS: ${VOICE_GENERATIVE_JUDGE_TIMEOUT_MS:-2000}
      VOICE_GENERATIVE_JUDGE_WORKER_ALLOWED_ENDPOINTS: http://generative-judge-worker:8092/internal/v1/generative-judge
      VOICE_GENERATIVE_JUDGE_WORKER_TOKEN: ${VOICE_GENERATIVE_JUDGE_WORKER_TOKEN:-}
      VOICE_GENERATIVE_JUDGE_WORKER_URL: http://generative-judge-worker:8092/internal/v1/generative-judge
      VOICE_GENERATIVE_CORRECTOR_HUB_ORIGIN: http://ai-agent-hub:5000
      VOICE_GENERATIVE_CORRECTOR_MAX_RESPONSE_BYTES: ${VOICE_GENERATIVE_CORRECTOR_MAX_RESPONSE_BYTES:-262144}
      VOICE_GENERATIVE_CORRECTOR_MODELS: ${VOICE_GENERATIVE_CORRECTOR_MODELS:-gemma-2b-it,phi-3-mini-instruct}
      VOICE_GENERATIVE_CORRECTOR_PROVIDERS: ${VOICE_GENERATIVE_CORRECTOR_PROVIDERS:-embedded,lmstudio,ollama}
      VOICE_GENERATIVE_CORRECTOR_TIMEOUT_MS: ${VOICE_GENERATIVE_CORRECTOR_TIMEOUT_MS:-30000}
      VOICE_GENERATIVE_CORRECTOR_WORKER_ALLOWED_ENDPOINTS: http://generative-corrector-worker:8093/internal/v1/voice-corrector
      VOICE_GENERATIVE_CORRECTOR_WORKER_TOKEN: ${VOICE_GENERATIVE_CORRECTOR_WORKER_TOKEN:-}
      VOICE_GENERATIVE_CORRECTOR_WORKER_URL: http://generative-corrector-worker:8093/internal/v1/voice-corrector
      VOICE_INTERNAL_SERVICE_TOKEN: "${VOICE_INTERNAL_SERVICE_TOKEN:?VOICE_INTERNAL_SERVICE_TOKEN must be set}"
      VOICE_IDEMPOTENCY_TTL_SECONDS: ${VOICE_IDEMPOTENCY_TTL_SECONDS:-86400}
      VOICE_HUB_MAX_CONCURRENT_REQUESTS: ${VOICE_HUB_MAX_CONCURRENT_REQUESTS:-2}
      VOICE_HUB_MAX_INFLIGHT_AUDIO_SECONDS: ${VOICE_HUB_MAX_INFLIGHT_AUDIO_SECONDS:-7200}
      VOICE_MAX_AUDIO_DURATION_SEC: ${VOICE_MAX_AUDIO_DURATION_SEC:-3600}
      VOICE_MAX_QUEUE_DEPTH: ${VOICE_MAX_QUEUE_DEPTH:-16}
      VOICE_PERSONALIZATION_ENCRYPTION_KEY: "${VOICE_PERSONALIZATION_ENCRYPTION_KEY:?VOICE_PERSONALIZATION_ENCRYPTION_KEY must be a Fernet key}"
      VOICE_PROVIDER: voice-runtime
      VOICE_RUNTIME_ALLOWED_ORIGINS: http://voice-runtime:8090
      VOICE_RUNTIME_MAX_RESPONSE_BYTES: ${VOICE_RUNTIME_MAX_RESPONSE_BYTES:-16777216}
      VOICE_RUNTIME_URL: http://voice-runtime:8090
    depends_on:
      restricted-inference-minimal:
        condition: service_healthy
        required: false
      restricted-inference-cpu:
        condition: service_healthy
        required: false
      restricted-inference-nvidia:
        condition: service_healthy
        required: false
      generative-judge-worker:
        condition: service_healthy
        required: false
      generative-corrector-worker:
        condition: service_healthy
        required: false
      voice-runtime-minimal:
        condition: service_healthy
        required: false
      voice-runtime-cpu:
        condition: service_healthy
        required: false
      voice-runtime-nvidia:
        condition: service_healthy
        required: false
    networks:
      default: {}
      generative-corrector-control: {}
      generative-judge-control: {}
      restricted-inference-control: {}
      voice-runtime-control: {}

  generative-judge-worker:
    <<: *generative-judge-common
    image: ${GENERATIVE_JUDGE_IMAGE:-ananta-generative-judge-worker}:${GENERATIVE_JUDGE_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.generative-judge-worker
      target: cpu
    profiles:
      - voice-generative-judge
    networks:
      generative-judge-control:
        aliases:
          - generative-judge-worker

  generative-corrector-worker:
    <<: *generative-corrector-common
    image: ${GENERATIVE_CORRECTOR_IMAGE:-ananta-generative-corrector-worker}:${GENERATIVE_CORRECTOR_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.generative-corrector-worker
      target: cpu
    profiles:
      - voice-generative-corrector
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      generative-corrector-control:
        aliases:
          - generative-corrector-worker
      generative-corrector-egress: {}

  voice-runtime-minimal:
    <<: *voice-runtime-common
    image: ${VOICE_RUNTIME_IMAGE:-ananta-voice-runtime}:${VOICE_RUNTIME_IMAGE_TAG:-local}-minimal
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.voice-runtime
      target: minimal
    profiles:
      - voice-minimal
      - voice-production-minimal
    environment:
      <<: *voice-runtime-environment
      VOICE_ASR_BACKEND: whisper_cpp
      VOICE_BACKEND_FALLBACK_ORDER: whisper_cpp
      VOICE_PRIMARY_BACKEND: whisper_cpp
      VOICE_POLICY_ALLOWED_BACKENDS: whisper_cpp
      VOICE_RECOGNITION_STRATEGY: single
      VOICE_RESOURCE_MAX_CONCURRENT_BACKENDS: "1"
      VOICE_RESOURCE_MAX_QUEUE_DEPTH: ${VOICE_MAX_QUEUE_DEPTH:-16}
      VOICE_RESOURCE_MAX_RAM_MB: ${VOICE_MINIMAL_RESOURCE_RAM_MB:-1536}
      VOICE_RESOURCE_MAX_VRAM_MB: "0"
      VOICE_SECONDARY_BACKENDS: ""
      VOICE_VAD_BACKEND: passthrough
    cpus: ${VOICE_MINIMAL_CPUS:-2.0}
    mem_limit: ${VOICE_MINIMAL_MEMORY:-2g}
    deploy:
      resources:
        limits:
          cpus: ${VOICE_MINIMAL_CPUS:-2.0}
          memory: ${VOICE_MINIMAL_MEMORY:-2g}
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256m
    networks:
      voice-runtime-control:
        aliases:
          - voice-runtime

  voice-runtime-cpu:
    <<: *voice-runtime-common
    image: ${VOICE_RUNTIME_IMAGE:-ananta-voice-runtime}:${VOICE_RUNTIME_IMAGE_TAG:-local}-cpu
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.voice-runtime
      target: cpu
    profiles:
      - voice-cpu
      - voice-production-cpu
    environment:
      <<: *voice-runtime-environment
      VOICE_ASR_BACKEND: vosk
      VOICE_BACKEND_FALLBACK_ORDER: ${VOICE_CPU_BACKEND_FALLBACK_ORDER:-vosk,whisper_cpp}
      # Single-backend deployments can explicitly disable calibration; fusion
      # keeps the promoted calibration catalog as its safe default.
      VOICE_CALIBRATION_PATH: ${VOICE_CPU_CALIBRATION_PATH-/models/voice/calibration/calibration.json}
      VOICE_FASTER_WHISPER_COMPUTE_TYPE: ${VOICE_CPU_FASTER_WHISPER_COMPUTE_TYPE:-int8}
      VOICE_FASTER_WHISPER_MODEL_PATH: ${VOICE_CPU_FASTER_WHISPER_MODEL_PATH:-/models/voice/faster-whisper}
      VOICE_FUSION_ENABLED: ${VOICE_CPU_FUSION_ENABLED:-true}
      VOICE_PRIMARY_BACKEND: vosk
      VOICE_POLICY_ALLOWED_BACKENDS: ${VOICE_CPU_POLICY_ALLOWED_BACKENDS:-vosk,whisper_cpp}
      VOICE_POLICY_ALLOWED_RECOGNITION_STRATEGIES: ${VOICE_CPU_POLICY_ALLOWED_RECOGNITION_STRATEGIES:-single,parallel_compare,classic_then_correct}
      VOICE_RECOGNITION_STRATEGY: ${VOICE_CPU_RECOGNITION_STRATEGY:-parallel_fusion}
      VOICE_RERUN_BACKEND: ${VOICE_CPU_RERUN_BACKEND:-whisper_cpp}
      VOICE_RESOURCE_MAX_CONCURRENT_BACKENDS: ${VOICE_MAX_PARALLEL_BACKENDS:-2}
      VOICE_RESOURCE_MAX_QUEUE_DEPTH: ${VOICE_MAX_QUEUE_DEPTH:-16}
      VOICE_RESOURCE_MAX_RAM_MB: ${VOICE_CPU_RESOURCE_RAM_MB:-3584}
      VOICE_RESOURCE_MAX_VRAM_MB: "0"
      # An explicitly empty value selects the lightweight Vosk-only path.
      # Use the non-colon expansion so Compose preserves that empty value.
      VOICE_SECONDARY_BACKENDS: ${VOICE_CPU_SECONDARY_BACKENDS-whisper_cpp}
      VOICE_VAD_BACKEND: ${VOICE_VAD_BACKEND:-webrtcvad}
      # Voxtral remains opt-in: operators must promote both immutable artifacts
      # into the read-only Voice model root before adding it to the allowlist.
      VOICE_RUNTIME_MODEL_PATH: ${VOICE_CPU_VOXTRAL_MODEL_PATH:-}
      VOICE_VOXTRAL_RUNNER_PATH: ${VOICE_CPU_VOXTRAL_RUNNER_PATH:-}
      VOICE_VOXTRAL_RUNNER_STYLE: ${VOICE_CPU_VOXTRAL_RUNNER_STYLE:-realtime}
    cpus: ${VOICE_CPU_CPUS:-4.0}
    mem_limit: ${VOICE_CPU_MEMORY:-4g}
    deploy:
      resources:
        limits:
          cpus: ${VOICE_CPU_CPUS:-4.0}
          memory: ${VOICE_CPU_MEMORY:-4g}
          pids: 256
        reservations:
          cpus: "0.50"
          memory: 512m
    networks:
      voice-runtime-control:
        aliases:
          - voice-runtime

  voice-runtime-nvidia:
    <<: *voice-runtime-common
    image: ${VOICE_RUNTIME_IMAGE:-ananta-voice-runtime}:${VOICE_RUNTIME_IMAGE_TAG:-local}-nvidia
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.voice-runtime
      target: nvidia
    profiles:
      - voice-nvidia
      - voice-production-nvidia
    environment:
      <<: *voice-runtime-environment
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: ${VOICE_NVIDIA_VISIBLE_DEVICES:-all}
      VOICE_ASR_BACKEND: faster_whisper
      VOICE_BACKEND_FALLBACK_ORDER: faster_whisper,vosk,whisper_cpp
      VOICE_FASTER_WHISPER_MODEL_PATH: /models/voice/faster-whisper
      VOICE_PRIMARY_BACKEND: faster_whisper
      VOICE_POLICY_ALLOWED_BACKENDS: faster_whisper,vosk,whisper_cpp
      VOICE_RECOGNITION_STRATEGY: ${VOICE_RECOGNITION_STRATEGY:-parallel_fusion}
      VOICE_RESOURCE_MAX_CONCURRENT_BACKENDS: ${VOICE_MAX_PARALLEL_BACKENDS:-2}
      VOICE_RESOURCE_MAX_QUEUE_DEPTH: ${VOICE_MAX_QUEUE_DEPTH:-16}
      VOICE_RESOURCE_MAX_RAM_MB: ${VOICE_NVIDIA_RESOURCE_RAM_MB:-7168}
      VOICE_RESOURCE_MAX_VRAM_MB: ${VOICE_NVIDIA_RESOURCE_VRAM_MB:-8192}
      VOICE_RUNTIME_DEVICE: cuda
      VOICE_SECONDARY_BACKENDS: vosk,whisper_cpp
      VOICE_VAD_BACKEND: ${VOICE_VAD_BACKEND:-webrtcvad}
    cpus: ${VOICE_NVIDIA_CPUS:-4.0}
    mem_limit: ${VOICE_NVIDIA_MEMORY:-8g}
    deploy:
      resources:
        limits:
          cpus: ${VOICE_NVIDIA_CPUS:-4.0}
          memory: ${VOICE_NVIDIA_MEMORY:-8g}
          pids: 256
        reservations:
          cpus: "0.50"
          memory: 1g
          devices:
            - driver: nvidia
              count: ${VOICE_NVIDIA_DEVICE_COUNT:-1}
              capabilities:
                - gpu
    networks:
      voice-runtime-control:
        aliases:
          - voice-runtime

  restricted-inference-minimal:
    <<: *restricted-inference-common
    image: ${RESTRICTED_INFERENCE_IMAGE:-ananta-restricted-inference}:${RESTRICTED_INFERENCE_IMAGE_TAG:-local}-minimal
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.restricted-inference
      target: minimal
    profiles:
      - inference-minimal
      - voice-production-minimal
    environment:
      <<: *restricted-inference-environment
      RESTRICTED_INFERENCE_DEVICE: cpu
      RESTRICTED_INFERENCE_ENABLED_ENGINES: ""
    cpus: ${RESTRICTED_MINIMAL_CPUS:-1.0}
    mem_limit: ${RESTRICTED_MINIMAL_MEMORY:-1g}
    deploy:
      resources:
        limits:
          cpus: ${RESTRICTED_MINIMAL_CPUS:-1.0}
          memory: ${RESTRICTED_MINIMAL_MEMORY:-1g}
          pids: 256
        reservations:
          cpus: "0.10"
          memory: 128m
    networks:
      restricted-inference-control:
        aliases:
          - restricted-inference-worker

  restricted-inference-cpu:
    <<: *restricted-inference-common
    image: ${RESTRICTED_INFERENCE_IMAGE:-ananta-restricted-inference}:${RESTRICTED_INFERENCE_IMAGE_TAG:-local}-cpu
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.restricted-inference
      target: cpu
    profiles:
      - inference-cpu
      - voice-production-cpu
    environment:
      <<: *restricted-inference-environment
      RESTRICTED_INFERENCE_DEVICE: cpu
      RESTRICTED_INFERENCE_ENABLED_ENGINES: sentence-transformers,onnxruntime,huggingface-transformers
    cpus: ${RESTRICTED_CPU_CPUS:-8.0}
    mem_limit: ${RESTRICTED_CPU_MEMORY:-12g}
    deploy:
      resources:
        limits:
          cpus: ${RESTRICTED_CPU_CPUS:-8.0}
          memory: ${RESTRICTED_CPU_MEMORY:-12g}
          pids: 256
        reservations:
          cpus: "1.0"
          memory: 2g
    healthcheck: *restricted-inference-readiness
    networks:
      restricted-inference-control:
        aliases:
          - restricted-inference-worker

  restricted-inference-nvidia:
    <<: *restricted-inference-common
    image: ${RESTRICTED_INFERENCE_IMAGE:-ananta-restricted-inference}:${RESTRICTED_INFERENCE_IMAGE_TAG:-local}-nvidia
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.restricted-inference
      target: nvidia
    profiles:
      - inference-nvidia
      - voice-production-nvidia
    environment:
      <<: *restricted-inference-environment
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: ${RESTRICTED_NVIDIA_VISIBLE_DEVICES:-all}
      RESTRICTED_INFERENCE_DEVICE: cuda
      RESTRICTED_INFERENCE_ENABLED_ENGINES: sentence-transformers,huggingface-transformers
    cpus: ${RESTRICTED_NVIDIA_CPUS:-8.0}
    mem_limit: ${RESTRICTED_NVIDIA_MEMORY:-24g}
    deploy:
      resources:
        limits:
          cpus: ${RESTRICTED_NVIDIA_CPUS:-8.0}
          memory: ${RESTRICTED_NVIDIA_MEMORY:-24g}
          pids: 256
        reservations:
          cpus: "1.0"
          memory: 4g
          devices:
            - driver: nvidia
              count: ${RESTRICTED_NVIDIA_DEVICE_COUNT:-1}
              capabilities:
                - gpu
    healthcheck: *restricted-inference-readiness
    networks:
      restricted-inference-control:
        aliases:
          - restricted-inference-worker

networks:
  default: {}
  generative-corrector-control:
    internal: true
  generative-corrector-egress:
    internal: false
  generative-judge-control:
    internal: true
  restricted-inference-control:
    internal: true
  voice-runtime-control:
    internal: true

volumes:
  hub-data: {}
