# Additive production overlay for local Voice and restricted, non-generative
# inference.  Select exactly one combined profile:
#   voice-production-minimal | voice-production-cpu | voice-production-nvidia
#
# Execution services retain capability-specific control networks with the Hub.
# Voice, restricted-inference, and judge workers cannot address each other.
# The optional corrector uses a separate non-internal egress network solely to
# call deployment-configured Ollama/LM-Studio endpoints; it does not join the
# application default network. Its API still requires the dedicated Hub
# credential and origin on the internal control network.

x-runtime-hardening: &runtime-hardening
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-file: "3"
      max-size: 10m

x-voice-runtime-common: &voice-runtime-common
  <<: *runtime-hardening
  user: "10001:10001"
  working_dir: /app
  expose:
    - "8090"
  environment: &voice-runtime-environment
    HF_HOME: /tmp/model-cache
    HF_DATASETS_OFFLINE: "1"
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    VOICE_ALLOW_MODEL_DOWNLOAD: "false"
    VOICE_ADAPTIVE_ROUTING_ENABLED: ${VOICE_ADAPTIVE_ROUTING_ENABLED:-true}
    VOICE_AUDIO_ENHANCEMENT_ENABLED: ${VOICE_AUDIO_ENHANCEMENT_ENABLED:-false}
    VOICE_BACKEND_FALLBACK_ORDER: whisper_cpp
    VOICE_CANDIDATE_DEADLINE_SEC: ${VOICE_CANDIDATE_DEADLINE_SEC:-120}
    VOICE_CALIBRATION_PATH: /models/voice/calibration/calibration.json
    VOICE_CORRECTION_POLICY: ${VOICE_CORRECTION_POLICY:-restricted_choice}
    VOICE_DIARIZATION_BACKEND: ${VOICE_DIARIZATION_BACKEND:-none}
    VOICE_DIARIZATION_MODEL_ROOT: ${VOICE_DIARIZATION_MODEL_ROOT:-/models/voice/diarization}
    VOICE_ENABLE_STREAMING: ${VOICE_ENABLE_STREAMING:-true}
    VOICE_ENHANCEMENT_VARIANTS: ${VOICE_ENHANCEMENT_VARIANTS:-original}
    VOICE_FASTER_WHISPER_BEAM_SIZE: ${VOICE_FASTER_WHISPER_BEAM_SIZE:-5}
    VOICE_FASTER_WHISPER_COMPUTE_TYPE: ${VOICE_FASTER_WHISPER_COMPUTE_TYPE:-default}
    VOICE_FASTER_WHISPER_VAD_FILTER: ${VOICE_FASTER_WHISPER_VAD_FILTER:-false}
    VOICE_FASTER_WHISPER_VAD_MIN_SILENCE_MS: ${VOICE_FASTER_WHISPER_VAD_MIN_SILENCE_MS:-500}
    VOICE_FALLBACK_MODEL: ${VOICE_FALLBACK_MODEL:-whisper-small}
    VOICE_GLOSSARY_PATH: ${VOICE_GLOSSARY_PATH:-}
    VOICE_INTERNAL_SERVICE_TOKEN: "${VOICE_INTERNAL_SERVICE_TOKEN:?VOICE_INTERNAL_SERVICE_TOKEN must be set}"
    VOICE_MAX_AUDIO_DURATION_SEC: ${VOICE_MAX_AUDIO_DURATION_SEC:-3600}
    VOICE_MAX_AUDIO_MB: ${VOICE_MAX_AUDIO_MB:-25}
    VOICE_MAX_DECODED_PCM_MB: ${VOICE_MAX_DECODED_PCM_MB:-256}
    VOICE_MAX_PARALLEL_BACKENDS: ${VOICE_MAX_PARALLEL_BACKENDS:-2}
    VOICE_MAX_CANDIDATE_COUNT: ${VOICE_MAX_CANDIDATE_COUNT:-8}
    VOICE_MAX_QUEUE_DEPTH: ${VOICE_MAX_QUEUE_DEPTH:-16}
    VOICE_MODEL: ${VOICE_MODEL:-whisper-small}
    VOICE_MODEL_MANIFEST_PATH: /models/voice/manifests/voice-models.json
    VOICE_MODEL_ROOT: /models/voice
    VOICE_POSTPROCESS_BACKEND: ${VOICE_POSTPROCESS_BACKEND:-rules}
    VOICE_PYANNOTE_MANIFEST_PATH: ${VOICE_PYANNOTE_MANIFEST_PATH:-/models/voice/diarization/manifest.json}
    VOICE_PRODUCTION_PROFILE: "true"
    VOICE_RECOGNITION_STRATEGY: ${VOICE_RECOGNITION_STRATEGY:-single}
    VOICE_RESTRICTED_CHOICE_HOOK_ENABLED: ${VOICE_RESTRICTED_CHOICE_HOOK_ENABLED:-true}
    VOICE_REQUIRE_INTERNAL_AUTH: "true"
    VOICE_RERUN_BACKEND: ${VOICE_RERUN_BACKEND:-whisper_cpp}
    VOICE_RERUN_MAX_AUDIO_MS: ${VOICE_RERUN_MAX_AUDIO_MS:-30000}
    VOICE_REVIEW_POLICY: ${VOICE_REVIEW_POLICY:-on_disagreement}
    VOICE_ROUTING_STRATEGY: ${VOICE_ROUTING_STRATEGY:-fixed}
    VOICE_RUNTIME_HOST: 0.0.0.0
    VOICE_RUNTIME_PORT: "8090"
    VOICE_STORE_AUDIO: "false"
    VOICE_TIMEOUT_SEC: ${VOICE_TIMEOUT_SEC:-120}
    VOICE_STREAM_TIMEOUT_SEC: ${VOICE_STREAM_TIMEOUT_SEC:-300}
    VOICE_TRANSPORT_MODE: ${VOICE_TRANSPORT_MODE:-stream}
    VOICE_VAD_BACKEND: ${VOICE_VAD_BACKEND:-webrtcvad}
    VOICE_SILERO_VAD_MODEL_PATH: ${VOICE_SILERO_VAD_MODEL_PATH:-}
    VOICE_SILERO_VAD_THRESHOLD: ${VOICE_SILERO_VAD_THRESHOLD:-0.5}
    VOICE_VOSK_MODEL_PATH: /models/voice/vosk
    VOICE_WHISPER_CPP_BIN: /models/voice/bin/whisper-cli
    VOICE_WHISPER_CPP_BEAM_SIZE: ${VOICE_WHISPER_CPP_BEAM_SIZE:-5}
    VOICE_WHISPER_CPP_GPU_LAYERS: ${VOICE_WHISPER_CPP_GPU_LAYERS:-0}
    VOICE_WHISPER_CPP_GPU_ENABLED: ${VOICE_WHISPER_CPP_GPU_ENABLED:-}
    VOICE_WHISPER_CPP_MODEL_PATH: /models/voice/whisper/ggml-small.bin
    VOICE_WHISPER_CPP_PROMPT_MAX_CHARS: ${VOICE_WHISPER_CPP_PROMPT_MAX_CHARS:-512}
    VOICE_WHISPER_CPP_TEMPERATURE: ${VOICE_WHISPER_CPP_TEMPERATURE:-0.0}
    VOICE_WHISPER_CPP_THREADS: ${VOICE_WHISPER_CPP_THREADS:-4}
  volumes:
    - type: bind
      source: ${VOICE_MODEL_DIR:-../../models/voice}
      target: /models/voice
      read_only: true
      bind:
        create_host_path: false
  tmpfs:
    - /tmp:size=536870912,mode=1770,uid=10001,gid=10001,noexec,nosuid,nodev
    - /run:size=16777216,mode=0750,uid=10001,gid=10001,noexec,nosuid,nodev
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import json,urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)); raise SystemExit(0 if payload.get('status') == 'ready' else 1)
    interval: 15s
    timeout: 4s
    retries: 5
    start_period: 20s

