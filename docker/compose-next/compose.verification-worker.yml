services:
  verification-worker:
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.verification-worker
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 2g
    cpus: 1.0
    user: "65532:65532"
    environment:
      PYTHONHASHSEED: "0"
    volumes:
      - ${ANANTA_VERIFICATION_REPOSITORY:?set repository path}:/task/repository:ro
      - ${ANANTA_VERIFICATION_WORKSPACE:?set task workspace path}:/task/workspace:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=65532,gid=65532
    command:
      - --assignment
      - /task/workspace/assignment.json
      - --repository
      - /task/repository
      - --output
      - /task/workspace/report.json
