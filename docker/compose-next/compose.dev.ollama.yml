services:
  ai-agent-hub:
    extends:
      file: compose.base.yml
      service: ai-agent-hub-base
    user: "${ANANTA_HOST_UID:-1000}:${ANANTA_HOST_GID:-1000}"
    command: sh -c "alembic upgrade head && exec python -m agent.ai_agent"
    environment:
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: hub
      HOME: /app/data/home
      XDG_CACHE_HOME: /app/data/cache
      FLASK_DEBUG: 1
      DEFAULT_PROVIDER: ollama
      DEFAULT_MODEL: ananta-phi4-mini-32k
      OLLAMA_MODEL: ananta-phi4-mini-32k
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434/api/generate}
      MODEL_PROFILES_PATH: /app/config/models/local-ollama-phi-gemma-rtx3080.model_profiles.yaml
      MODEL_ROUTING_PATH: /app/config/models/local-ollama-phi-gemma-rtx3080.model_routing.json
      # compose.base.yml supplies an inline development default. This local
      # stack deliberately clears it so the file-managed Hub key is the sole
      # session-signing authority.
      SECRET_KEY: ""
      ANANTA_WORKFLOW_AUTH_SIGNING_KEYRING_FILE: /run/ananta-dev-workflow/workflow-auth-signing-keyring.json
      ANANTA_WORKFLOW_DISPATCH_KEYRING_FILE: /run/ananta-dev-workflow/workflow-dispatch-keyring.json
      ANANTA_WORKFLOW_REQUIRE_REGISTERED_WORKER_AUTH: "1"
      ANANTA_WORKFLOW_WORKER_REGISTRATION_KEYRING_FILE: /run/ananta-dev-workflow/worker-registration-keyring.json
      ANANTA_SOURCE_ACCESS_KEYRING_FILE: /run/ananta-source-access/source-access-hmac-keyring.json
      ANANTA_SOURCE_ACCESS_ALLOW_COMPOSE_SECRET_DERIVATION: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      AGENT_TOKEN_FILE: /run/ananta-dev-workflow/hub-service-token
      SECRET_KEY_FILE: /run/ananta-dev-workflow/hub-session-signing-key
      AGENT_TOKEN_PERSISTENCE: "0"
      OPENROUTER_API_KEY: ""
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ananta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ananta}"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      # Mount only live application sources. Runtime secrets, ignored files,
      # Git metadata and local model blobs never become visible under /app.
      - ../../agent:/app/agent:ro
      - ../../worker:/app/worker:ro
      - ../../ananta_contracts:/app/ananta_contracts:ro
      - ../../ananta_codecompass:/app/ananta_codecompass:ro
      - ../../client_runtime:/app/client_runtime:ro
      - ../../client_surfaces:/app/client_surfaces:ro
      - ../../src:/app/src:ro
      - ../../config:/app/config:ro
      - ../../migrations:/app/migrations:ro
      - ../../scripts:/app/scripts:ro
      - ../../prompts:/app/prompts:ro
      - ../../policies:/app/policies:ro
      - ../../profiles:/app/profiles:ro
      - ../../schemas:/app/schemas:ro
      - ../../simulation:/app/simulation:ro
      - ../../voice_runtime:/app/voice_runtime:ro
      - ../../alembic.ini:/app/alembic.ini:ro
      - ../../project-workspaces:/project-workspaces:rw
      - hub-data:/app/data
      - type: bind
        source: ${ANANTA_DEV_WORKFLOW_SECRET_DIR:-../../../ananta-data/workflow-runtime-dev}/hub
        target: /run/ananta-dev-workflow
        read_only: true
      - type: bind
        source: ${ANANTA_DEV_WORKFLOW_SECRET_DIR:-../../../ananta-data/workflow-runtime-dev}/worker
        target: /run/ananta-source-access
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-bootstrap:
        condition: service_completed_successfully
      workflow-keyring-bootstrap:
        condition: service_completed_successfully
      runtime-data-bootstrap:
        condition: service_completed_successfully

  ai-agent-alpha:
    extends:
      file: compose.base.yml
      service: ai-agent-worker-base
    user: "${ANANTA_HOST_UID:-1000}:${ANANTA_HOST_GID:-1000}"
    command: sh -c "alembic upgrade head && exec python -m agent.ai_agent"
    environment:
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: worker
      HOME: /app/data/home
      XDG_CACHE_HOME: /app/data/cache
      FLASK_DEBUG: 1
      DEFAULT_PROVIDER: ollama
      DEFAULT_MODEL: ananta-phi4-mini-32k
      OLLAMA_MODEL: ananta-phi4-mini-32k
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434/api/generate}
      MODEL_PROFILES_PATH: /app/config/models/local-ollama-phi-gemma-rtx3080.model_profiles.yaml
      MODEL_ROUTING_PATH: /app/config/models/local-ollama-phi-gemma-rtx3080.model_routing.json
      SECRET_KEY: ""
      ANANTA_WORKFLOW_AUTH_VERIFICATION_KEYRING_FILE: /run/ananta-dev-workflow/public/workflow-auth-verification-keyring.json
      ANANTA_WORKFLOW_HUB_URL: http://ai-agent-hub:5000
      ANANTA_WORKFLOW_HUB_TOKEN_FILE: /run/ananta-dev-workflow/private/worker-service-token
      ANANTA_SOURCE_ACCESS_KEYRING_FILE: /run/ananta-dev-workflow/public/source-access-hmac-keyring.json
      ANANTA_SOURCE_ACCESS_ALLOW_COMPOSE_SECRET_DERIVATION: "0"
      AGENT_TOKEN_FILE: /run/ananta-dev-workflow/private/worker-service-token
      SECRET_KEY_FILE: /run/ananta-dev-workflow/private/worker-session-signing-key
      REGISTRATION_TOKEN_FILE: /run/ananta-dev-workflow/private/worker-registration-token
      AGENT_TOKEN_PERSISTENCE: "0"
      DISABLE_INITIAL_ADMIN: "1"
      INITIAL_ADMIN_USER: ""
      INITIAL_ADMIN_PASSWORD: ""
      OPENROUTER_API_KEY: ""
      AGENT_NAME: ${ANANTA_WORKER_ALPHA_ID:-ananta-worker-1}
      ANANTA_KNOWLEDGE_INDEX_WORKER_ID: ${ANANTA_WORKER_ALPHA_ID:-ananta-worker-1}
      AGENT_URL: http://ai-agent-alpha:5000
      HUB_URL: http://ai-agent-hub:5000
      # Workers use isolated local databases. They receive an allowlisted task
      # manifest from the Hub and cannot prewrite authoritative Hub state.
      DATABASE_URL: sqlite:////app/data/ananta.db
      REDIS_URL: ""
    volumes:
      - ../../agent:/app/agent:ro
      - ../../worker:/app/worker:ro
      - ../../ananta_contracts:/app/ananta_contracts:ro
      - ../../ananta_codecompass:/app/ananta_codecompass:ro
      - ../../client_runtime:/app/client_runtime:ro
      - ../../client_surfaces:/app/client_surfaces:ro
      - ../../src:/app/src:ro
      - ../../config:/app/config:ro
      - ../../migrations:/app/migrations:ro
      - ../../scripts:/app/scripts:ro
      - ../../prompts:/app/prompts:ro
      - ../../policies:/app/policies:ro
      - ../../profiles:/app/profiles:ro
      - ../../schemas:/app/schemas:ro
      - ../../simulation:/app/simulation:ro
      - ../../voice_runtime:/app/voice_runtime:ro
      - ../../alembic.ini:/app/alembic.ini:ro
      - ../../project-workspaces:/project-workspaces:rw
      - alpha-data:/app/data
      - type: bind
        source: ${ANANTA_DEV_WORKFLOW_SECRET_DIR:-../../../ananta-data/workflow-runtime-dev}/worker
        target: /run/ananta-dev-workflow/public
        read_only: true
      - type: bind
        source: ${ANANTA_DEV_WORKFLOW_SECRET_DIR:-../../../ananta-data/workflow-runtime-dev}/alpha
        target: /run/ananta-dev-workflow/private
        read_only: true
    depends_on:
      ai-agent-hub:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-bootstrap:
        condition: service_completed_successfully
      workflow-keyring-bootstrap:
        condition: service_completed_successfully
      runtime-data-bootstrap:
        condition: service_completed_successfully

  ai-agent-beta:
    extends:
      file: compose.base.yml
      service: ai-agent-worker-base
    user: "${ANANTA_HOST_UID:-1000}:${ANANTA_HOST_GID:-1000}"
    command: sh -c "alembic upgrade head && exec python -m agent.ai_agent"
    environment:
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: worker
      HOME: /app/data/home
      XDG_CACHE_HOME: /app/data/cache
      FLASK_DEBUG: 1
      DEFAULT_PROVIDER: ollama
      DEFAULT_MODEL: ananta-phi4-mini-32k
      OLLAMA_MODEL: ananta-phi4-mini-32k
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434/api/generate}
      MODEL_PROFILES_PATH: /app/config/models/local-ollama-phi-gemma-rtx3080.model_profiles.yaml
      MODEL_ROUTING_PATH: /app/config/models/local-ollama-phi-gemma-rtx3080.model_routing.json
      SECRET_KEY: ""
      ANANTA_WORKFLOW_AUTH_VERIFICATION_KEYRING_FILE: /run/ananta-dev-workflow/public/workflow-auth-verification-keyring.json
      ANANTA_WORKFLOW_HUB_URL: http://ai-agent-hub:5000
      ANANTA_WORKFLOW_HUB_TOKEN_FILE: /run/ananta-dev-workflow/private/worker-service-token
      ANANTA_SOURCE_ACCESS_KEYRING_FILE: /run/ananta-dev-workflow/public/source-access-hmac-keyring.json
      ANANTA_SOURCE_ACCESS_ALLOW_COMPOSE_SECRET_DERIVATION: "0"
      AGENT_TOKEN_FILE: /run/ananta-dev-workflow/private/worker-service-token
      SECRET_KEY_FILE: /run/ananta-dev-workflow/private/worker-session-signing-key
      REGISTRATION_TOKEN_FILE: /run/ananta-dev-workflow/private/worker-registration-token
      AGENT_TOKEN_PERSISTENCE: "0"
      DISABLE_INITIAL_ADMIN: "1"
      INITIAL_ADMIN_USER: ""
      INITIAL_ADMIN_PASSWORD: ""
      OPENROUTER_API_KEY: ""
      AGENT_NAME: ${ANANTA_WORKER_BETA_ID:-ananta-worker-2}
      ANANTA_KNOWLEDGE_INDEX_WORKER_ID: ${ANANTA_WORKER_BETA_ID:-ananta-worker-2}
      AGENT_URL: http://ai-agent-beta:5000
      HUB_URL: http://ai-agent-hub:5000
      # Never share the Hub's PostgreSQL principal or authoritative Task rows.
      DATABASE_URL: sqlite:////app/data/ananta.db
      REDIS_URL: ""
    volumes:
      - ../../agent:/app/agent:ro
      - ../../worker:/app/worker:ro
      - ../../ananta_contracts:/app/ananta_contracts:ro
      - ../../ananta_codecompass:/app/ananta_codecompass:ro
      - ../../client_runtime:/app/client_runtime:ro
      - ../../client_surfaces:/app/client_surfaces:ro
      - ../../src:/app/src:ro
      - ../../config:/app/config:ro
      - ../../migrations:/app/migrations:ro
      - ../../scripts:/app/scripts:ro
      - ../../prompts:/app/prompts:ro
      - ../../policies:/app/policies:ro
      - ../../profiles:/app/profiles:ro
      - ../../schemas:/app/schemas:ro
      - ../../simulation:/app/simulation:ro
      - ../../voice_runtime:/app/voice_runtime:ro
      - ../../alembic.ini:/app/alembic.ini:ro
      - ../../project-workspaces:/project-workspaces:rw
      - beta-data:/app/data
      - type: bind
        source: ${ANANTA_DEV_WORKFLOW_SECRET_DIR:-../../../ananta-data/workflow-runtime-dev}/worker
        target: /run/ananta-dev-workflow/public
        read_only: true
      - type: bind
        source: ${ANANTA_DEV_WORKFLOW_SECRET_DIR:-../../../ananta-data/workflow-runtime-dev}/beta
        target: /run/ananta-dev-workflow/private
        read_only: true
    depends_on:
      ai-agent-hub:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-bootstrap:
        condition: service_completed_successfully
      workflow-keyring-bootstrap:
        condition: service_completed_successfully
      runtime-data-bootstrap:
        condition: service_completed_successfully

  angular-frontend:
    extends:
      file: compose.base.yml
      service: angular-frontend-base
    user: "${ANANTA_HOST_UID:-1000}:${ANANTA_HOST_GID:-1000}"
    volumes:
      - frontend-node-modules:/app/frontend-angular/node_modules:ro
    environment:
      ANANTA_QUICKSTART_MODE: role
      ANANTA_QUICKSTART_ROLE: frontend
      HOME: /app/frontend-angular/.angular/home
      XDG_CACHE_HOME: /app/frontend-angular/.angular/cache
    depends_on:
      ai-agent-hub:
        condition: service_healthy
      runtime-data-bootstrap:
        condition: service_completed_successfully

  postgres:
    image: postgres:16.13@sha256:5a65324fe84dc41709ff914e90b07f3e2f577073ed27bf917d4873aca0c9ec51
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ananta}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-ananta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ananta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"

  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"

  ollama:
    image: ollama/ollama:0.32.4@sha256:0ab10b9b9dc5f50d30dc61aec25e3316822ca22cf0f27d4e98d74cc7dedd7c80
    restart: unless-stopped
    gpus: all
    ports:
      - "${OLLAMA_PORT:-127.0.0.1:11434}:11434"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      # Host bind mount: models remain visible and backupable in WSL, never in
      # a Docker-managed volume. OLLAMA_DATA_DIR may point to another WSL path.
      - type: bind
        source: ${OLLAMA_DATA_DIR:-../../../ananta-data/ollama}
        target: /root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  model-bootstrap:
    image: ollama/ollama:0.32.4@sha256:0ab10b9b9dc5f50d30dc61aec25e3316822ca22cf0f27d4e98d74cc7dedd7c80
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BOOTSTRAP_OFFLINE: ${OLLAMA_BOOTSTRAP_OFFLINE:-0}
    volumes:
      - ../../config/models/modelfiles:/modelfiles:ro
      - ../../scripts/ollama-create-ananta-model-aliases.sh:/usr/local/bin/ollama-create-ananta-model-aliases.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-create-ananta-model-aliases.sh"]

  workflow-keyring-bootstrap:
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.quickstart-no-ollama
      args:
        ANANTA_RUNTIME_UID: ${ANANTA_HOST_UID:-1000}
        ANANTA_RUNTIME_GID: ${ANANTA_HOST_GID:-1000}
    image: ${ANANTA_QUICKSTART_IMAGE:-ananta-quickstart-no-ollama:local}
    restart: "no"
    user: "${ANANTA_HOST_UID:-1000}:${ANANTA_HOST_GID:-1000}"
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /app
    entrypoint: ["python", "/app/scripts/bootstrap-dev-workflow-keyrings.py"]
    command:
      - "--root"
      - "/run/ananta-dev-workflow"
      - "--alpha-worker-id"
      - "${ANANTA_WORKER_ALPHA_ID:-ananta-worker-1}"
      - "--beta-worker-id"
      - "${ANANTA_WORKER_BETA_ID:-ananta-worker-2}"
      - "--owner-uid"
      - "${ANANTA_HOST_UID:-1000}"
      - "--owner-gid"
      - "${ANANTA_HOST_GID:-1000}"
    depends_on:
      runtime-data-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../../scripts/bootstrap-dev-workflow-keyrings.py:/app/scripts/bootstrap-dev-workflow-keyrings.py:ro
      - type: bind
        source: ${ANANTA_DEV_WORKFLOW_SECRET_DIR:-../../../ananta-data/workflow-runtime-dev}
        target: /run/ananta-dev-workflow

  runtime-data-bootstrap:
    build:
      context: ../..
      dockerfile: docker/compose-next/Dockerfile.quickstart-no-ollama
      args:
        ANANTA_RUNTIME_UID: ${ANANTA_HOST_UID:-1000}
        ANANTA_RUNTIME_GID: ${ANANTA_HOST_GID:-1000}
    image: ${ANANTA_QUICKSTART_IMAGE:-ananta-quickstart-no-ollama:local}
    restart: "no"
    user: "0:0"
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    working_dir: /app
    entrypoint: ["python", "/app/scripts/bootstrap-dev-runtime-ownership.py"]
    command:
      - "--data-root"
      - "/run/ananta-dev-data"
      - "--workspace-root"
      - "/project-workspaces"
      - "--credential-root"
      - "/run/ananta-dev-workflow"
      - "--owner-uid"
      - "${ANANTA_HOST_UID:-1000}"
      - "--owner-gid"
      - "${ANANTA_HOST_GID:-1000}"
    volumes:
      - ../../scripts/bootstrap-dev-runtime-ownership.py:/app/scripts/bootstrap-dev-runtime-ownership.py:ro
      - ../../project-workspaces:/project-workspaces
      - type: bind
        source: ${ANANTA_DEV_WORKFLOW_SECRET_DIR:-../../../ananta-data/workflow-runtime-dev}
        target: /run/ananta-dev-workflow
      - hub-data:/run/ananta-dev-data/hub
      - alpha-data:/run/ananta-dev-data/alpha
      - beta-data:/run/ananta-dev-data/beta
      - frontend-angular-cache:/run/ananta-dev-data/frontend-angular-cache

volumes:
  hub-data:
  alpha-data:
  beta-data:
  postgres-data:
  redis-data:
  frontend-node-modules:
  frontend-angular-cache:
