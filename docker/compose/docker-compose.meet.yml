# Additive overlay for either existing ai-agent-hub Compose deployment.
# No Meet restart, network change or worker configuration is required.
services:
  ai-agent-hub:
    environment:
      ANANTA_MEET_ENABLED: ${ANANTA_MEET_ENABLED:-0}
      ANANTA_MEET_ORIGIN: ${ANANTA_MEET_ORIGIN:-https://webrtc.ananta.de}
      ANANTA_MEET_ROOM_ALLOCATION_ENABLED: ${ANANTA_MEET_ROOM_ALLOCATION_ENABLED:-0}
      ANANTA_MEET_ROOM_ALLOCATION_SCOPES: ${ANANTA_MEET_ROOM_ALLOCATION_SCOPES:-[]}
      ANANTA_MEET_PUBLIC_ROOM: ${ANANTA_MEET_PUBLIC_ROOM:-0}
      ANANTA_MEET_PUBLIC_ROOM_SCOPES: ${ANANTA_MEET_PUBLIC_ROOM_SCOPES:-}
      MEET_PUBLIC_ROOM_TITLE: ${MEET_PUBLIC_ROOM_TITLE:-Ananta ai-snake}
      MEET_ROOM_SERVER_URL: ${MEET_ROOM_SERVER_URL:-https://webrtc.ananta.de}
      MEET_ROOM_TOKEN_URL: ${MEET_ROOM_TOKEN_URL:-https://keycloak.ananta.de/realms/ananta/protocol/openid-connect/token}
      MEET_ROOM_CLIENT_ID: ${MEET_ROOM_CLIENT_ID:-webrtc-browser}
      # Operator-supplied, never committed: username/password or client secret.
      MEET_ROOM_USERNAME: ${MEET_ROOM_USERNAME:-}
      MEET_ROOM_PASSWORD: ${MEET_ROOM_PASSWORD:-}
      MEET_ROOM_CLIENT_SECRET: ${MEET_ROOM_CLIENT_SECRET:-}
