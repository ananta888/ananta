# Add to the existing Ananta Hub deployment, not the standalone media project.
# Operator chooses exact tenant/project pairs; an empty list authorizes nothing.
services:
  ai-agent-hub:
    environment:
      ANANTA_MEET_ENABLED: ${ANANTA_MEET_ENABLED:-0}
      ANANTA_MEET_ORIGIN: ${ANANTA_MEET_ORIGIN:-https://webrtc.ananta.de}
      ANANTA_MEET_ROOM_ALLOCATION_ENABLED: ${ANANTA_MEET_ROOM_ALLOCATION_ENABLED-0}
      ANANTA_MEET_ROOM_ALLOCATION_SCOPES: ${ANANTA_MEET_ROOM_ALLOCATION_SCOPES-[]}
      ANANTA_MEET_MEDIA_ENABLED: ${ANANTA_MEET_MEDIA_ENABLED:-0}
      ANANTA_MEET_MEDIA_ALLOWED_SCOPES: ${ANANTA_MEET_MEDIA_ALLOWED_SCOPES:-[]}
      ANANTA_MEET_MEDIA_WORKER_URL: http://meet-media-worker:8094/v1/turns
      ANANTA_MEET_MEDIA_KEY_FILE: /run/secrets/meet-worker-key
      ANANTA_MEET_SPEECH_MAX_SECONDS: ${ANANTA_MEET_SPEECH_MAX_SECONDS:-40}
      ANANTA_MEET_MEDIA_CAPACITY_POOL: ${ANANTA_MEET_MEDIA_CAPACITY_POOL:-local-meet-media}
      ANANTA_MEET_MACHINE_ENABLED: ${ANANTA_MEET_MACHINE_ENABLED:-0}
      ANANTA_MEET_MACHINE_ISSUER: ${ANANTA_MEET_MACHINE_ISSUER:-}
      ANANTA_MEET_MACHINE_KEY_FILE: /run/secrets/meet-machine-private.pem
      ANANTA_MEET_MACHINE_KEY_ID: ${ANANTA_MEET_MACHINE_KEY_ID-}
      ANANTA_MEET_DIALOG_ENABLED: ${ANANTA_MEET_DIALOG_ENABLED:-0}
      ANANTA_MEET_DIALOG_POLICIES: ${ANANTA_MEET_DIALOG_POLICIES:-[]}
      ANANTA_MEET_ORGANIZATION_PRINCIPALS_ENABLED: ${ANANTA_MEET_ORGANIZATION_PRINCIPALS_ENABLED-0}
      ANANTA_MEET_DIALOG_PREAUTHORIZATION_ENABLED: ${ANANTA_MEET_DIALOG_PREAUTHORIZATION_ENABLED-0}
      ANANTA_MEET_DIALOG_RECONNECT: ${ANANTA_MEET_DIALOG_RECONNECT-0}
      ANANTA_MEET_MEDIA_TIMING: ${ANANTA_MEET_MEDIA_TIMING-0}
      ANANTA_MEET_SPEAKER_FLOOR: ${ANANTA_MEET_SPEAKER_FLOOR-0}
      ANANTA_MEET_SPEAKER_POLICIES: ${ANANTA_MEET_SPEAKER_POLICIES-[]}
      ANANTA_MEET_DIALOG_CAPACITY: "${ANANTA_MEET_DIALOG_CAPACITY-{}}"
      ANANTA_MEET_DIALOG_CAPACITY_POOL: ${ANANTA_MEET_DIALOG_CAPACITY_POOL-local-meet-dialog}
      # Absent remains absent: even [] opts into the publisher selector.
      # Compose resolves an explicit process/--env-file value without inventing one.
      ANANTA_MEET_DIALOG_WORKER_URLS:
      ANANTA_MEET_BROWSER_PUBLIC_POLICIES: ${ANANTA_MEET_BROWSER_PUBLIC_POLICIES:-[]}
    volumes:
      - ${MEET_MEDIA_STATE_DIR:?Set private runtime directory}/worker-key:/run/secrets/meet-worker-key:ro
      - ${MEET_MEDIA_STATE_DIR:?Set private runtime directory}/machine-private.pem:/run/secrets/meet-machine-private.pem:ro
    networks:
      meet-compute:
        aliases: [meet-authorizing-hub]
networks:
  meet-compute:
    external: true
    name: ${MEET_MEDIA_NETWORK:-ananta-meet-media_meet-compute}
