name: ananta-semantic-media

services:
  semantic-media-sfu:
    profiles: ["semantic-media-sfu"]
    image: livekit/livekit-server@sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
    command: ["--config", "/etc/livekit/livekit.yaml"]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
    volumes:
      - ./config/livekit.semantic-media.yaml:/etc/livekit/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${ANANTA_SEMANTIC_MEDIA_SFU_API_KEY:?Set an ephemeral LiveKit API key}: ${ANANTA_SEMANTIC_MEDIA_SFU_API_SECRET:?Set an ephemeral LiveKit API secret}"
    ports:
      - "${ANANTA_SEMANTIC_MEDIA_SFU_BIND_IP:-127.0.0.1}:${ANANTA_SEMANTIC_MEDIA_SFU_HTTP_PORT:-7880}:7880/tcp"
      - "${ANANTA_SEMANTIC_MEDIA_SFU_BIND_IP:-127.0.0.1}:${ANANTA_SEMANTIC_MEDIA_SFU_TCP_PORT:-7881}:7881/tcp"
      - "${ANANTA_SEMANTIC_MEDIA_SFU_BIND_IP:-127.0.0.1}:${ANANTA_SEMANTIC_MEDIA_SFU_UDP_PORT:-7882}:7882/udp"
      - "${ANANTA_SEMANTIC_MEDIA_SFU_BIND_IP:-127.0.0.1}:${ANANTA_SEMANTIC_MEDIA_SFU_TURN_UDP_PORT:-3478}:3478/udp"
    networks:
      - semantic-media-edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${ANANTA_SEMANTIC_MEDIA_SFU_CPU_LIMIT:-2.0}"
          memory: "${ANANTA_SEMANTIC_MEDIA_SFU_MEMORY_LIMIT:-1G}"
          pids: 256
    restart: unless-stopped
    labels:
      ananta.sfu.placement-mode: "single_node_compatibility"
      ananta.sfu.distributed-gate-eligible: "false"

  semantic-media-turn-gate:
    profiles: ["semantic-media-turn-gate"]
    image: coturn/coturn:4.6.3-r3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --lt-cred-mech
      - --realm=ananta.semantic-media.gate
      - --user=${ANANTA_SEMANTIC_MEDIA_TURN_GATE_USER:?Set an ephemeral TURN user}:${ANANTA_SEMANTIC_MEDIA_TURN_GATE_PASSWORD:?Set an ephemeral TURN password}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --log-file=stdout
      - --pidfile=
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    # The upstream turnserver binary carries cap_net_bind_service=ep. Keep the
    # corresponding bounding capability so exec succeeds, while dropping every
    # unrelated capability.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/lib/coturn:rw,noexec,nosuid,nodev,size=4m,uid=65534,gid=65534
    ports:
      - "${ANANTA_SEMANTIC_MEDIA_TURN_GATE_BIND_IP:-127.0.0.1}:${ANANTA_SEMANTIC_MEDIA_TURN_GATE_PORT:-3479}:3478/udp"
      - "${ANANTA_SEMANTIC_MEDIA_TURN_GATE_BIND_IP:-127.0.0.1}:49160-49200:49160-49200/udp"
    networks:
      - semantic-media-edge
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 64
    restart: "no"

networks:
  semantic-media-edge:
    driver: bridge
    # No Hub/Worker service is attached implicitly. Browser ingress uses only
    # the explicitly published WebRTC ports above.
