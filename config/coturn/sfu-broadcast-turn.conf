# Runtime substitutions are performed into a tmpfs file by the entrypoint.
realm=__TURN_REALM__
server-name=__TURN_SERVER_NAME__
listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349
external-ip=__TURN_EXTERNAL_IP__
min-port=__TURN_MIN_PORT__
max-port=__TURN_MAX_PORT__

fingerprint
lt-cred-mech
use-auth-secret
stale-nonce=600

cert=/run/secrets/turn_tls_certificate
pkey=/run/secrets/turn_tls_private_key
no-sslv3
no-tlsv1
no-tlsv1_1
cipher-list=HIGH:!aNULL:!MD5:!RC4

total-quota=2000
user-quota=8
max-bps=8000000
bps-capacity=1000000000
max-allocate-lifetime=600
permission-lifetime=300
channel-lifetime=300

no-cli
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff

# Prometheus stays on the shared sidecar loopback namespace.  Username labels
# remain disabled by omission of prometheus-username-labels.
prometheus
prometheus-address=127.0.0.1
prometheus-port=9641

log-file=stdout
simple-log
