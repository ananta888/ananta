# Optional Hub overlay. Video inspection is independently disabled by default.
services:
  ai-agent-hub:
    environment:
      ANANTA_PERSONA_VIDEOS_ENABLED: ${ANANTA_PERSONA_VIDEOS_ENABLED:-0}
      ANANTA_PERSONA_VIDEO_RETENTION_ENABLED: ${ANANTA_PERSONA_VIDEO_RETENTION_ENABLED:-0}
      ANANTA_PERSONA_VIDEO_WORKER_URL: http://persona-video-worker:8096/v1/persona-videos
      ANANTA_PERSONA_VIDEO_KEY_FILE: /run/secrets/persona-video-key
      ANANTA_PERSONA_VIDEO_REPOSITORY_REVISION: ${ANANTA_PERSONA_VIDEO_REPOSITORY_REVISION:-}
      ANANTA_PERSONA_VIDEO_EXECUTION_PROFILE_DIGEST: ${ANANTA_PERSONA_VIDEO_EXECUTION_PROFILE_DIGEST:-}
      ANANTA_PERSONA_VIDEO_ENVIRONMENT_DIGEST: ${ANANTA_PERSONA_VIDEO_ENVIRONMENT_DIGEST:-}
    volumes:
      - ${PERSONA_VIDEO_STATE_DIR:?Set an absolute private video state directory}/worker-key:/run/secrets/persona-video-key:ro
    networks:
      persona-videos:
        aliases: [persona-authorizing-hub]
networks:
  persona-videos:
    external: true
    name: ${PERSONA_VIDEO_NETWORK:-ananta-persona-videos_persona-videos}
